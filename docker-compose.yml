# Production compose stack for the Mnemonic MCP server.
#
#   docker compose --env-file mcp.env up -d
#
# Services:
#   mcp     — the mnemonic-mcp HTTP server (CI image from GHCR, build fallback).
#   ollama  — local LLM for /chat. Profile-gated: co-located by default, skipped
#             for a split deploy (COMPOSE_PROFILES= + OLLAMA_URL=remote).
#   nginx   — TLS terminator + reverse proxy + static webapp. Domain-agnostic:
#             uses the stable cert path /etc/letsencrypt/live/mnemonic/.
#   certbot — renews the LetsEncrypt cert (webroot). Initial issuance is a
#             one-shot documented in mcp/deploy/README.md (init-letsencrypt.sh).
#
# Topology knobs live in mcp.env (see mcp/deploy/compose.env.example).

services:
  mcp:
    image: ${MCP_IMAGE:-ghcr.io/mnemonik-xyz/mnemonic-mcp}:${MCP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: mcp/Dockerfile
    restart: unless-stopped
    env_file:
      - mcp.env
    environment:
      # Default to co-located ollama; overridden by OLLAMA_URL in mcp.env.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    # Loopback by default: only the nginx container (same network) and the host
    # reach it. Set MCP_BIND=0.0.0.0 in mcp.env if a REMOTE nginx fronts this box.
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-3000}:3000"
    volumes:
      - mcp-data:/data
      - mcp-keypair:/keypair
    networks:
      mnemonic:
      caddy:
        # Alias expected by the fabric-deployed Caddy reverse proxy
        # (mcp.mnemonik.xyz -> http://mnemonik-mcp:3000).
        aliases:
          - mnemonik-mcp
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  ollama:
    profiles: ["ollama"]
    build:
      context: ./ollama
    image: ${OLLAMA_IMAGE:-monorepo-ollama}
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [mnemonic]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webapp/dist:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      mcp:
        condition: service_healthy
    networks: [mnemonic]
    # Reload every 6h so renewed certs are picked up without a restart.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Attempt renewal twice a day (LetsEncrypt recommended); no-op until due.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mcp-data:
  mcp-keypair:
  ollama-data:
  certbot-etc:
  certbot-webroot:

networks:
  mnemonic:
    driver: bridge
  caddy:
    # External network shared with the fabric-deployed Caddy container.
    # Default matches the vaultwarden compose project on the fabric VM;
    # override with CADDY_NETWORK_NAME in mcp.env if the project name differs.
    external: true
    name: ${CADDY_NETWORK_NAME:-vaultwarden_default}
