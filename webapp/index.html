<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP must also be enforced as an HTTP response header by the static host
      (nginx config in mcp/deploy/). The meta tag below is the in-document
      defense-in-depth layer. Header and meta MUST stay in sync — see Risks
      table (XSS row) in work/mnemonic-integrations/tech-spec.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://mcp.mnemonik.xyz https://*.trycloudflare.com http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
    />
    <title>Mnemonic Protocol — verifiable, persistent memory for AI agents</title>
    <meta name="description" content="Verifiable, persistent memory for AI agents. Signed COSE_Sign1 envelopes anchored on Solana via SPL Memo, accessed through MCP. Open-source, Apache-2.0." />
    <meta name="theme-color" content="#9945FF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/logo-512.png" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mnemonic Protocol" />
    <meta property="og:title" content="Mnemonic Protocol — verifiable memory for AI agents" />
    <meta property="og:description" content="Signed, persistent, on-chain-anchored memory for AI agents. Built on Solana, accessed via MCP." />
    <meta property="og:url" content="https://mnemonik.xyz/" />
    <meta property="og:image" content="https://mnemonik.xyz/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mnemonic Protocol" />
    <meta name="twitter:description" content="Verifiable, persistent memory for AI agents — signed, anchored on Solana, accessed via MCP." />
    <meta name="twitter:image" content="https://mnemonik.xyz/og-image.png" />

    <!-- Crawlable by AI clients -->
    <link rel="alternate" type="application/json" title="Agent card" href="/.well-known/agent.json" />
  </head>
  <body class="bg-background text-text-primary min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
