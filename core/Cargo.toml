[package]
name = "mnemonic-core"
version = "0.2.8"
edition = "2021"
description = "Mnemonic Protocol core library — verifiable memory attestation for AI agents"

[lib]
# `cdylib` is required for `wasm-pack build core --target web` to emit a `.wasm`
# binary; `rlib` keeps the crate usable as a normal Rust dependency from `mcp/`.
# Both are necessary — emitting only `cdylib` would break the native workspace
# build because `mnemonic-mcp` links to `mnemonic-core` as an rlib.
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ciborium = "0.2"
coset = "0.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "js"] }
bs58 = "0.5"
bincode = "1"
ndarray = "0.16"
turboquant-plus-rs = "0.1.0"
solana-sdk = "2.2"
spl-memo = "6"
futures = "0.3"
tracing = "0.1"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "6"
crypto_box = "0.9"
tempfile = "3"
fastembed = { version = "5", optional = true }
tokio = { version = "1", features = ["time", "rt"] }

# Native-only deps: rusqlite (bundled C SQLite) and reqwest do not compile for
# wasm32-unknown-unknown. The storage/arweave/solana modules that use them are
# also gated to non-wasm32 in core/src/lib.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }

[features]
default = []
local-embed = ["fastembed"]
openssl-vendored = ["openssl-sys/vendored"]
# Enables the `core::wasm` module (wasm-bindgen wrappers around identity +
# attestation signing). The actual WASM dependencies are gated by
# `cfg(target_arch = "wasm32")`; this feature is the explicit opt-in so
# native builds never compile the module body.
wasm = []
# Enables `core/tests/golden_fixtures.rs`, which emits a deterministic JSON
# array of `{name, input_hex, canonical_cbor_hex, cose_envelope_hex,
# keypair_secret_hex}` triples for SDK byte-for-byte parity tests. The
# emitter is a `#[ignore]`d integration test invoked via
# `cargo test --features golden-fixtures -p mnemonic-core --test golden_fixtures emit_fixtures -- --ignored --nocapture`.
# See work/mnemonic-cli/tech-spec.md Decision 12.
golden-fixtures = []
# Verifiable trajectories (work/verifiable-trajectories/): STEP/VERDICT/TRAJECTORY
# schemas, ordered-chain verification, and order-preserving Merkle roots.
# Experimental until V1 GA is declared in that feature's decisions.md. Default
# `cargo build --workspace` excludes it.
trajectory-experimental = []
# Intent–action correspondence (work/research/computation-proof/): INTENT/ACTION
# schemas + a verify-only correspondence layer (verify_correspondence,
# action_commitment, policy_valid tri-state). Experimental until V1 GA. Default
# `cargo build --workspace` excludes it. Proving lives in the `mnemonic-prover`
# crate, never here (the "no prover in core/" rule stands).
correspondence-experimental = []

[dependencies.openssl-sys]
version = "0.9"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# tempfile is already in [dependencies] (used by FileKeyStore::set in production);
# no dev-dep entry needed — the regular dep is visible to test code.
httpmock = "0.8"
proptest = "1"
criterion = { version = "0.5", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[[bench]]
name = "decompress"
harness = false

[[bench]]
name = "decompress_fidelity"
harness = false

[[bench]]
name = "decompress_fidelity_real"
harness = false
required-features = ["local-embed"]

[[bench]]
name = "cbor_codec"
harness = false

# `cargo run --example emit_golden -- <out_dir>` writes the byte-for-byte
# fixture set `packages/extension/tests/fixtures/golden/` consumes (T05).
# Gated behind `golden-fixtures` so default `cargo build` ignores the
# example entirely.
[[example]]
name = "emit_golden"
required-features = ["golden-fixtures"]

# `cargo run --example golden-keystore-gen` prints the canonical JSON for the
# cross-language golden byte-equality fixture (Task 10). No feature gate.
[[example]]
name = "golden-keystore-gen"

# WASM target dependencies — only pulled in when building for wasm32-unknown-unknown.
# Native (`cargo build --workspace`) builds do not see any of these.
#
# Version note (deviation from tech-spec Decision 3 pinning):
#   tech-spec.md pinned `wasm-bindgen = "=0.2.95"` and `wasm-bindgen-test = "=0.3.45"`,
#   but `solana-sdk = "2.2"` transitively depends on `js-sys = "^0.3.77"`, which itself
#   depends on `wasm-bindgen = "=0.2.100"`. The exact 0.2.95 pin is unsatisfiable in
#   the current dependency graph. Bumped to 0.2.100 (the version forced by the
#   transitive constraint) and matched `wasm-bindgen-test = 0.3.50` (compatible with
#   0.2.100). Logged in work/mnemonic-integrations/decisions.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
# Two `getrandom` versions appear in the dependency graph (transitive via
# solana-sdk + ahash). Each needs its WebCrypto backend enabled explicitly:
#   - 0.2 → `js` feature
#   - 0.3 → `wasm_js` feature
# Without these, getrandom fails to compile (0.3) or panics at runtime (0.2).
getrandom = { version = "0.2", features = ["js"] }
getrandom_v03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.50"
