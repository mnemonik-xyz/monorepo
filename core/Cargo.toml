[package]
name = "mnemonic-core"
version = "0.1.0"
edition = "2021"
description = "Mnemonic Protocol core library — verifiable memory attestation for AI agents"

[lib]

[dependencies]
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ciborium = "0.2"
coset = "0.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
bs58 = "0.5"
bincode = "1"
ndarray = "0.16"
turboquant-plus-rs = "0.1.0"
solana-sdk = "2.2"
spl-memo = "6"
rusqlite = { version = "0.34", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
futures = "0.3"
tracing = "0.1"
fastembed = { version = "5", optional = true }
tokio = { version = "1", features = ["time", "rt"] }

[features]
default = []
local-embed = ["fastembed"]
openssl-vendored = ["openssl-sys/vendored"]

[dependencies.openssl-sys]
version = "0.9"
optional = true

[dev-dependencies]
httpmock = "0.8"
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[[bench]]
name = "decompress"
harness = false

[[bench]]
name = "cbor_codec"
harness = false
