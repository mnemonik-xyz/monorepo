# nginx server block for the hosted MCP subdomain.
#
# Purpose: route https://mcp.mnemonik.xyz/* traffic to the local mnemonic-mcp
# binary on 127.0.0.1:3000. The existing mnemonik.xyz block (webapp + /chat)
# stays untouched; this file adds a *second* server block alongside it.
#
# Deployed to /etc/nginx/sites-available/mnemonic-mcp on the VPS, symlinked
# from /etc/nginx/sites-enabled/mnemonic-mcp. See deployment.md
# ("Subdomain: mcp.mnemonik.xyz") for the deploy procedure.
#
# After certbot --nginx -d mcp.mnemonik.xyz the listen-443 + ssl_certificate
# directives may be rewritten in place; the canonical form below already
# matches the post-certbot layout so the cert command becomes a no-op rerun.
#
# OPERATOR NOTE — `server_tokens off;` (T11 #3 hardening) belongs in the
# global `http {}` context of /etc/nginx/nginx.conf because per-server-block
# directives cannot turn off the version-banner that nginx writes to error
# pages. Add the following line under `http {` if it isn't already present:
#
#     server_tokens off;
#
# Without it, nginx leaks its exact version in error pages and the Server:
# response header — narrowing an attacker's CVE search.

# HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.mnemonik.xyz;

    # Let's Encrypt ACME challenge passthrough (certbot --nginx writes this
    # automatically; included here so a manual rerun stays idempotent).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS terminator + reverse proxy to mnemonic-mcp on localhost:3000.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.mnemonik.xyz;

    # Certbot-managed certificate paths (standard layout).
    ssl_certificate     /etc/letsencrypt/live/mcp.mnemonik.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.mnemonik.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # TLS hardening (T11 #3) — the certbot-managed include above already
    # pins `ssl_protocols TLSv1.2 TLSv1.3;` and `ssl_prefer_server_ciphers off;`
    # (Mozilla intermediate). We DO NOT redeclare them here because nginx
    # rejects duplicate `ssl_prefer_server_ciphers` directives in the same
    # server block (T14 deploy finding). If certbot ever ships an
    # `options-ssl-nginx.conf` that drops the explicit `ssl_protocols` line,
    # uncomment the directive below AND remove the certbot include's copy:
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;

    # Security headers. Auth + rate-limiting are enforced by mnemonic-mcp itself
    # (Decision 9 of tech-spec.md); nginx only adds defense-in-depth headers.
    # HSTS (T11 #3) — the API subdomain is HTTPS-only forever; preload-eligible.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cap request body so a runaway Smithery probe can't fill memory.
    # sign_memory bundles are <32 KB by Decision 12; 256 KB leaves headroom.
    client_max_body_size 256k;

    # Streamable-HTTP MCP endpoint. proxy_buffering off + 120s read timeout
    # support long-running JSON-RPC streams (per Decision 1 of tech-spec).
    location /mcp {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # OAuth 2.1 + PKCE endpoints (Decision 11 of tech-spec).
    location /oauth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth metadata + MCP protected-resource discovery (RFC 8414 + MCP spec).
    # MCP clients (Claude.ai, VS Code, Cursor) probe these BEFORE attempting
    # any authorization flow — without these endpoints proxied through, the
    # connector setup short-circuits with "couldn't reach the MCP server"
    # because their .well-known probes return nginx's default 404.
    #
    # The ACME challenge is handled in the :80 server block above; this :443
    # location takes precedence over the apex `/` proxy_pass for any other
    # /.well-known/* path that mnemonic-mcp serves.
    location /.well-known/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sign-callback + pending-bundle fetch (Decision 12 of tech-spec).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness probe. Used by Smithery and by smoke checks.
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        access_log off;
    }

    # Apex (root path) MCP endpoint — Claude.ai's connector POSTs to
    # `https://mcp.mnemonik.xyz/` after OAuth completes, ignoring any
    # path the user supplied in the "Add custom connector" form.
    # Without this proxy_pass, Claude-User requests return nginx's
    # default 404 and the connector silently drops without ever
    # invoking a tool. Cursor + VS Code use `/mcp` (above); axum
    # mounts both `/` and `/mcp` to the same JSON-RPC handler.
    # Streaming-friendly settings mirror the /mcp block.
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Block admin endpoints at the edge.
    location /admin {
        return 403;
    }

    # Default: nothing else is publicly served on this subdomain.
    location / {
        return 404;
    }
}
