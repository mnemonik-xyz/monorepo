[package]
name = "mnemonic-mcp"
version = "0.1.0"
edition = "2021"
description = "Mnemonic MCP server — verifiable memory attestation primitive for AI agents"

[dependencies]
# Core library (all domain types: codec, identity, embed, compress, storage,
# arweave, solana, lineage flow in from here).
mnemonic-core = { path = "../core" }

# Async runtime
tokio = { version = "1", features = ["full"] }
# Stream wrappers for streamable HTTP NDJSON framing (Decision 1)
tokio-stream = "0.1"
# Streams + futures combinators (used by Body::from_stream for chunked responses).
# Pinned explicitly — do NOT rely on it being a transitive of axum/tokio.
futures = "0.3"
# Frame buffers used in the streamable HTTP NDJSON pipeline. Pinned explicitly
# rather than relying on the axum/tokio transitive — Body::from_stream emits
# `Bytes` directly.
bytes = "1"

# HTTP server (remote MCP transport)
axum = { version = "0.8", features = ["json", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
# Form-urlencoded body parsing for /oauth/token (RFC 6749 §3.2 mandates
# Content-Type: application/x-www-form-urlencoded; VS Code, Claude.ai,
# and most OAuth client libraries default to that — only Cursor sends JSON).
serde_urlencoded = "0.7"

# Rate limiting (POST /chat: 10 req/min per IP)
governor = "0.8"

# Sharded concurrent hash map for the per-`api_key_hash` delivery-quota
# counter (modes-user-choice T3 — DoS guard). Per-shard locks held briefly
# only; never across `.await` (Decision 8 of the tech-spec extended to
# DashMap). `5` matches the same major used elsewhere in the workspace.
dashmap = "5"

# blake3 — used for the api_key → api_key_hash digest that keys the delivery
# DoS guard. Hashing the bearer key before it lands in any audit row keeps
# the raw credential out of the database (CWE-312).
blake3 = "1"

# OAuth 2.1 + PKCE server primitives (Decision 9-11, Task 4)
# Pinned per tech-spec; cargo tree -p governor must show one major version after add.
oauth2 = "=4.4.2"
jsonwebtoken = "=9.3.0"
# LRU cache for OAuthState pending challenges + issued codes; Task 5 reuses this dep.
lru = "=0.12.5"
# Per-IP rate limiting on /mcp + /oauth/*. Pinned to 0.7.0 — the latest version
# whose transitive `governor` crate matches the existing `governor = "0.8"` dep
# from `pricing.rs`. Tech-spec suggested `=0.8.0` but that version pulls in
# `governor 0.10`, producing a duplicate major. Logged in decisions.md.
tower_governor = "=0.7.0"

# HTTP client (used by pricing.rs for Irys + SOL/USDC price fetches)
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto / Solana (Keypair type used in McpState and tool signatures)
solana-sdk = "2.2"

# Hashing (legacy v1 artifact verification in tools.rs)
sha2 = "0.10"
hex = "0.4"

# HMAC-SHA256 — used by `confirmation_token.rs` to bind the
# `request_public_write_confirmation` mint to (content_hash || owner_pubkey ||
# visibility || expires_at || jti). Decision 5b — agent-native-distribution.
# RustCrypto, small, audited; matches the sha2 major already pinned.
hmac = "0.12"

# Encoding
base64 = "0.22"

# SQLite (payment.rs uses rusqlite::params + error types on SqliteStore::conn())
rusqlite = { version = "0.34", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Config
dotenvy = "0.15"

# URL parsing (OLLAMA_URL whitelist validation)
url = "2"

# Percent-encoding for OAuth query strings (Google start/callback redirects).
# Already pulled in transitively via reqwest; surfaced as a direct dep so we
# don't roll a custom encoder (round-1 code-reviewer finding #7).
percent-encoding = "2"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"

# UUID
uuid = { version = "1", features = ["v4"] }

# RNG — used by oauth::authorize_init_handler for the 16-byte server nonce
# (Decision 10). Pinned to 0.8 to match the existing transitive used by
# solana-sdk; bumping to 0.9 introduces a duplicate major.
rand = "0.8"

# x25519 key agreement for the CLI bootstrap symmetric flow (Task 12).
# `SalsaBox` (XSalsa20-Poly1305 + Curve25519) — same major as core's dep.
crypto_box = "0.9"

# ZIP archive (artifact generation in seed.rs)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Recursive directory traversal (RAG seeding walks docs/**/*.md)
walkdir = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optional dep — gated by the `test-support` feature so it does NOT enter
# production builds. The same crate is also a regular `[dev-dependencies]`
# entry below so plain `cargo test` keeps working without enabling features.
tempfile = { version = "3", optional = true }

[features]
default = []
# Forwards to mnemonic-core's local-embed feature (fastembed ONNX runtime).
local-embed = ["mnemonic-core/local-embed"]
# Vendor OpenSSL from source (used in CI cross-compilation).
openssl-vendored = ["mnemonic-core/openssl-vendored"]
# Exposes `mnemonic_mcp::test_support` (mock_state + mint_jwt) outside `#[cfg(test)]`
# so the `mint-test-jwt` binary and CI helpers can reach the same JWT-issue path
# the integration tests use. Not enabled by default — production builds NEVER
# compile this in. See Task 8 § Step 1 in work/mnemonic-integrations/tasks/8.md.
# Activates the optional `tempfile` dep so `mock_state()` can mint per-test
# scratch SQLite databases.
test-support = ["dep:tempfile"]

# Pin the Google OAuth integration test to the `test-support` feature so
# Cargo emits a clear "test requires feature test-support, not running"
# message when the flag is omitted instead of silently producing
# `0 tests, 0 benchmarks` from the file-level `#![cfg(feature = ...)]` gate
# (round-1 test-reviewer finding #1).
[[test]]
name = "oauth_google"
path = "tests/oauth_google.rs"
required-features = ["test-support"]

# Same feature-gating pattern for the chrome-extension key-escrow tests (T15).
[[test]]
name = "key_escrow"
path = "tests/key_escrow.rs"
required-features = ["test-support"]

# Task-12 symmetric CLI bootstrap ticket flow tests.
[[test]]
name = "api_cli_bootstrap"
path = "tests/api_cli_bootstrap.rs"
required-features = ["test-support"]

# T3 modes-user-choice delivery-guarantee tests. Uses `mock_state_for_delivery`
# from `mnemonic_mcp::test_support` (gated behind the same feature).
[[test]]
name = "delivery_guarantee"
path = "tests/delivery_guarantee.rs"
required-features = ["test-support"]

# T2 agent-native-distribution discovery surfaces (prompts/list,
# prompts/get, resources/list, resources/read, enriched tools/list).
# Uses `mock_state` from `mnemonic_mcp::test_support` and exercises the
# anonymous-allowlist path through `oauth::bearer_auth_middleware`.
[[test]]
name = "discovery_anonymous"
path = "tests/discovery_anonymous.rs"
required-features = ["test-support"]

# Task 4 agent-native-distribution — sign_memory visibility resolver +
# Decision 5b public-write confirmation gate + anonymous recall filter +
# parametrized Error Catalogue coverage.
[[test]]
name = "sign_memory_visibility"
path = "tests/sign_memory_visibility.rs"
required-features = ["test-support"]

[[test]]
name = "anonymous_recall"
path = "tests/anonymous_recall.rs"
required-features = ["test-support"]

[[test]]
name = "confirmation_gate"
path = "tests/confirmation_gate.rs"
required-features = ["test-support"]

[[test]]
name = "error_catalogue"
path = "tests/error_catalogue.rs"
required-features = ["test-support"]

[dev-dependencies]
tempfile = "3"
httpmock = "0.8"
# regex — used by `_helpers/delivery_harness.rs` to match any Arweave GET
# path (the arlocal write path self-mints the tx_id from a PRNG, so the
# test can't pre-register a specific path).
regex = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"
# Task-12: used in api_cli_bootstrap tests for client-side crypto operations.
crypto_box = "0.9"
# Adversarial JSON re-encoder used by tests/roundtrip_cose_via_http_proxy.rs to
# mutate envelope bytes (key reorder, whitespace normalize) and prove the
# base64 cose_bundle field survives byte-identical (Decision 7 + Risks R1).
simd-json = "0.13"
# In-process RSA keypair generation for the Google-OAuth integration test
# (T14). The mock JWKS / token sub-server in `tests/oauth_google.rs` mints
# its own RS256 key at test setup, exposes (n, e) as a JWK, and signs the
# `id_token`. Dev-only; production never touches this crate.
rsa = "0.9"
num-bigint-dig = "0.8"
