[package]
name = "bridge-a2a"
version = "0.1.0"
edition = "2021"
description = "Mnemonic A2A sidecar bridge — intercepts A2A JSON-RPC, attests via mnemonic-a2a"

[lib]
name = "bridge_a2a"
path = "src/lib.rs"

[[bin]]
name = "bridge-a2a"
path = "src/main.rs"

[dependencies]
mnemonic-a2a = { path = "../mnemonic-a2a" }
mnemonic-core = { path = "../core", features = ["a2a-experimental"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
lru = "0.12"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
solana-sdk = "2.2"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"
http = "1"
http-body-util = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum-test = "21"
tempfile = "3"
