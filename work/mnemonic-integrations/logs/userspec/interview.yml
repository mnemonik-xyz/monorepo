# ============================================================================
# Notes
# ============================================================================
notes: |
  - Existing user-spec.md draft (commit 72bd8eb) is starting point — but scope CHANGED in round 2.
  - research.md is comprehensive — 14 surfaces, 11 mechanisms, 3 phases, 8 open questions.

  ROUND 2 CLARIFICATIONS (2026-04-26):
  - Use case = cross-provider context portability for individual users.
    Capture artifacts in Tool A (ChatGPT/etc), attest, replay in Tool B (Claude/etc) without losing context.
    NOT marketing/distribution flow.
  - Browser extension IS in Phase 1 scope but with mitigation via in-extension verification
    (acknowledge ShadowPrompt risk but want to mitigate, not defer).
  - Tests: protocol conformance (cargo) + headless agent in CI. Smithery validator NOT required.
  - "User should not be obligated to run anything besides browser" — hosted server path is mandatory.

  ROUND 3 CLARIFICATIONS (2026-04-26):
  - THREE delivery channels, each with distinct audience:
    1. MCP — for agents and power-users. Hosted (`mcp.mnemonic.dev`) + docker image + Smithery/registry listings.
    2. WASM — `mnemonic-core` compiled via wasm-pack. Powers webapp + browser extension (and possibly npm @mnemonic/core for 3rd-party devs).
    3. Website — `mnemonik.xyz` — primarily marketing/advertising. Drives installs of MCP/extension. NOT the capture/replay tool itself.

  ROUND 4 CRITICAL SHIFT (2026-04-26):
  - MNEMONIC IS NOT A CAPTURE TOOL. The integration IS the MCP connector itself.
  - Flow: Tool A & Tool B both have Mnemonic MCP installed. User in Tool A says natural-language
    "save this onchain" → model calls `sign_memory` (user approves prompt) → Arweave + Solana.
    User in Tool B says "recall my X" → model calls `recall` → cosine search → context returned.
  - NO DOM scraping, NO copy-paste, NO chat history extraction. Capture is explicit
    user-triggered tool call via natural language.
  - Storage = Arweave (decentralized) for attested bundles. localStorage only for user-specific
    data (keypair, prefs, bundle index for browse UI).
  - Webapp scope SHIFTS: not capture/replay UI, but install hub + identity manager + bundle browser.

  ROUND 5 CONFIRMATIONS (2026-04-26):
  - Webapp scope = 7 features (preferably all in P1):
    (1) marketing landing, (2) install hub with deeplinks, (3) identity (keypair),
    (4) your bundles browser, (5) top-up balance UI, (6) bundle delete/privacy,
    (7) stats dashboard
  - Auth: Sign-in-with-Solana via Turnkey MPC (email-based wallet creation/recovery,
    Ed25519-native, MPC custody, cross-device via email login). NOT raw localStorage keypair.
    Self-host docker = local keypair file (current MCP behavior).
  - Tests: (III) MCP Inspector on PR + Claude Code in CI on nightly/pre-release smoke.
  - Browser extension — Phase 1.5, deferred. Not blocker.
  - NPM `@mnemonic/core` publish — aim, scope-decision in Phase 1 still TBD.

  CRITICAL GAPS still open after round 2:
  - Capture mechanism — manual paste / extension DOM grab / clipboard hook
  - Storage location — browser localStorage / hosted DB / both with sync
  - Replay mechanism — clipboard+?q= / extension inject / MCP tool call (model-driven retrieval)
  - Auth for hosted server (cross-device sync requires account)
  - WASM webapp — reuse existing mnemonic-webapp or new one
  - Extension scope (Phase 1 inclusive? P1.5? P2?)
