# cargo-audit configuration — exceptions to the default
# `cargo audit --deny warnings` gate in CI.
#
# To add an exception:
#   1. Run `cargo audit` locally and copy the RUSTSEC-XXXX-YYYY id.
#   2. Add it to `[advisories] ignore` below.
#   3. Add a comment justifying why we accept the risk and tracking
#      when it can be removed (upstream fix, dep upgrade, etc).
#
# Re-runs of `cargo audit --deny warnings` will fail loudly when a new
# CVE drops, surfacing it for prompt triage.

[advisories]
ignore = [
    # ── Transitive via solana-sdk 2.3.x (Solana SDK pins these crate versions;
    #    upgrading requires a full solana-sdk major bump that we batch with
    #    other Solana RPC work, not here):

    # curve25519-dalek 3.2.0 — timing variability in Scalar*::sub. Reachable
    # only via ed25519-dalek 1.0.1, used for Solana Ed25519 verification of
    # data we already trust (we never key-agree with attacker-controlled
    # scalars). Solana SDK upgrade tracked separately.
    "RUSTSEC-2024-0344",

    # ed25519-dalek 1.0.1 — Double Public Key Signing oracle. Pulled in by
    # solana-signature 2.3.0; solana-sdk 2.3.x pins 1.0.1. Mitigated upstream
    # by Solana's own keypair handling (no raw signing API exposed to us).
    "RUSTSEC-2022-0093",

    # atty 0.2.14 — unmaintained + potential unaligned read on Windows.
    # Pulled in by solana-logger via env_logger 0.9. We do not run on
    # Windows; the unaligned-read advisory does not affect Linux.
    "RUSTSEC-2024-0375",
    "RUSTSEC-2021-0145",

    # bincode 1.3.3 — unmaintained. Transitive via solana-program;
    # solana-sdk 2.x has not yet migrated to bincode 2.
    "RUSTSEC-2025-0141",

    # derivative — unmaintained, transitive via solana-program.
    "RUSTSEC-2024-0388",

    # libsecp256k1 — unmaintained, transitive via solana-secp256k1-recover.
    # Solana's own pinning; no in-project use of secp256k1.
    "RUSTSEC-2025-0161",

    # paste — unmaintained, transitive macro via solana crates.
    "RUSTSEC-2024-0436",

    # rand 0.7.3 — unsound under custom logger (`rand::rng`). Transitive
    # via solana-keypair / ed25519-dalek 1.0.1; mnemonic-* code uses
    # rand 0.8/0.9 directly, not 0.7.
    "RUSTSEC-2026-0097",

    # memmap2 0.5.10 — unchecked pointer offset in advise_range /
    # unchecked_advise_range / MmapMut. Severity: INFO Unsound — invalid
    # pointer is passed to madvise/msync syscalls but never dereferenced.
    # Fixed upstream in memmap2 0.9.11 (memmap2-rs PR #170, merged
    # 2026-06-22); no 0.5.x backport exists. solana-sdk 2.3.x pins
    # memmap2 0.5.x via solana-genesis-config → solana-rent-collector.
    # The code path is the Solana validator genesis-config bootloader,
    # which is unreachable in mnemonic-mcp: we use solana-sdk only for
    # SPL Memo RPC writes/reads, never boot a validator. Verified
    # `grep -rn 'memmap\|Mmap::\|GenesisConfig' core/src/ mcp/src/`
    # returns zero hits. Removed when the broader Solana SDK 2.x → 3.x
    # bump lands.
    "RUSTSEC-2026-0186",

    # ── Transitive via reqwest 0.11 + oauth2 4.x (oauth2 5 requires
    #    reqwest 0.12 with breaking API changes; tracked as a separate
    #    HTTP-client modernization task):

    # rustls-webpki 0.101 — wildcard name constraint, URI name constraint,
    # and CRL parsing panic. We use rustls only as TLS for outbound HTTPS to
    # arweave.net / api.openai.com / Solana RPCs (all controlled endpoints
    # with valid certs); the name-constraint advisories require an attacker
    # to control the cert chain, which is out of our threat model.
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0104",

    # rustls-pemfile 1.x — unmaintained, transitive via reqwest 0.11.
    "RUSTSEC-2025-0134",

    # ── Transitive via fastembed → hf-hub (model-download UX, not on the
    #    request-handling hot path):

    # number_prefix — unmaintained, used by indicatif via hf-hub.
    "RUSTSEC-2025-0119",

    # ── Direct dep, accepted with mitigations:

    # lru 0.12.5 — unsound IterMut violates Stacked Borrows. We never call
    # IterMut on the LRUs (only `put`/`pop`/`peek`/`peek_by_id`), so the
    # advisory is unreachable in our codepaths. Bump to 0.13.x tracked
    # in the broader dep-refresh sweep.
    "RUSTSEC-2026-0002",

    # rsa 0.9.x — Marvin Attack (timing sidechannel during RSA decryption).
    # No fixed upgrade is available upstream. We only pull this in as a
    # `[dev-dependencies]` of `mnemonic-mcp` for the Google-OAuth integration
    # test in `mcp/tests/oauth_google.rs`, which mints a fresh 2048-bit RSA
    # key per test purely to sign mock `id_token` JWTs for our own
    # JWKS verifier. The crate never enters production builds and never
    # decrypts attacker-controlled ciphertext, so the timing sidechannel
    # has no exploitable codepath. Tracked upstream
    # (https://github.com/RustCrypto/RSA/issues/19); revisit when a fixed
    # release lands.
    "RUSTSEC-2023-0071",
]
