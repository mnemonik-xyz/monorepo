worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml;
    gzip_min_length 256;

    # Chat messages cap ~2000 chars; publish/sign payloads a bit larger.
    client_max_body_size 256k;

    upstream mcp_backend { server mcp:3000; }

    # Reusable proxy headers (rate limiting handled by the MCP governor crate).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Port 80: ACME challenge + redirect to HTTPS ----------------------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- Port 443: the app ------------------------------------------------
    # Domain-agnostic cert path: certbot issues with `--cert-name mnemonic`,
    # so this block never needs editing per-domain (init-letsencrypt.sh sets it).
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/mnemonic/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mnemonic/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Block operator-only admin surface.
        location /admin { return 403; }

        # ---- Same-origin API surface → MCP backend ------------------------
        location = /stats             { proxy_pass http://mcp_backend; }
        location = /artifacts         { proxy_pass http://mcp_backend; }
        location /analytics/          { proxy_pass http://mcp_backend; }
        location /api/                { proxy_pass http://mcp_backend; }
        location /oauth/              { proxy_pass http://mcp_backend; }
        location /.well-known/        { proxy_pass http://mcp_backend; }
        location = /download-knowledge { proxy_pass http://mcp_backend; }
        location = /health            { proxy_pass http://mcp_backend; access_log off; }

        # MCP JSON-RPC (external clients) + root JSON-RPC (Claude.ai posts to /).
        location /mcp {
            proxy_pass http://mcp_backend;
            proxy_read_timeout 60s;
        }

        # Chat: longer timeout for CPU LLM inference.
        location /chat {
            proxy_pass http://mcp_backend;
            proxy_read_timeout 120s;
        }

        # Blog is BOTH a prerendered static page AND a backend endpoint.
        # Disambiguate by method + Accept: JSON readers / POST publishes → backend;
        # everything else → the prerendered HTML in the SPA.
        location = /blog/feed.xml { root /usr/share/nginx/html; }
        location /blog {
            if ($request_method = POST)            { proxy_pass http://mcp_backend; }
            if ($http_accept ~* application/json)  { proxy_pass http://mcp_backend; }
            root /usr/share/nginx/html;
            try_files $uri $uri/ $uri/index.html /index.html;
        }

        # Root JSON-RPC POST (Claude.ai dynamic-registration connector) → backend.
        location = / {
            if ($request_method = POST) { proxy_pass http://mcp_backend; }
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }

        # Static React SPA (prerendered HTML + assets), SPA fallback.
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
