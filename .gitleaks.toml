# gitleaks configuration — extends the built-in default ruleset and adds
# path-based allowlists for test fixtures and synthetic test data that
# trip the `jwt` and `generic-api-key` heuristics with no actual secret.
#
# Why this exists: gitleaks default rules are tuned for production-secret
# detection and produce false positives against:
#   - Synthetic JWT-shaped strings used to verify CLI/SDK error redaction
#     (the whole point of those tests is to assert we DON'T leak the
#     fake JWT into stderr).
#   - The committed COSE golden fixtures (`packages/sdk/test/fixtures/
#     golden-cose.json`) — every entry has a base58-encoded
#     pubkey/signature blob whose entropy looks like an API key but is
#     output of `core/tests/golden_fixtures.rs::emit_fixtures`.
#   - Audit findings + decision logs in `work/` that quote test fixtures
#     verbatim.
#
# Each path entry is a regex anchored against repo-root-relative paths.
# Discovered via `gh run view <run-id> --job <gitleaks> --log-failed`.

[extend]
useDefault = true

# Detect JWTs baked into install configs / deeplinks pointing at the
# production webapp domain (Decision 15 / tech-spec §Risks row 4). A user
# pasting an install URL into a public GitHub issue, blog post, or commit
# would not be caught by the default `jwt` rule alone because that rule is
# allow-listed for our test fixtures; this scoped rule re-enables JWT
# detection specifically when the JWT appears near a `mc.mnemonik.xyz` or
# `mnemonik.xyz/install` reference.
[[rules]]
id = "mnemonic-jwt-baked-deeplink"
description = "JWT baked into mcp.json install config or /install deeplink for mc.mnemonik.xyz"
regex = '''ey[A-Za-z0-9_\-]{10,}\.ey[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'''
keywords = ["mc.mnemonik.xyz", "mnemonik.xyz/install"]
tags = ["jwt", "token", "secret", "mnemonic-deeplink"]

[allowlist]
description = "test fixtures + synthetic test JWTs / pubkeys"
paths = [
    # CLI test fixtures — synthetic pubkeys + JWTs assert error redaction.
    '''packages/cli/test/.*\.test\.ts''',
    # SDK test fixtures — JWT-shaped strings, mock OAuth flows.
    # Both `test/` (sdk Phase 1 layout) and `tests/` (Phase 1.5+ T02
    # browser-bundle layout) are covered — the project uses both naming
    # conventions across packages.
    '''packages/sdk/test/.*\.test\.ts''',
    '''packages/sdk/tests/.*\.test\.ts''',
    # Golden COSE fixtures — base58 pubkeys/sigs regenerated from Rust core.
    '''packages/sdk/test/fixtures/golden-cose\.json''',
    # Extension tests + golden fixtures (T01 scaffolding, T05 WASM crypto
    # parity). Fixture JSONs contain deterministic seed bytes (e.g.
    # `00112233...deadbeef`) that look like API keys; placeholder JWTs like
    # `test.jwt.token` in `.test.ts` trip the `jwt` heuristic. Same posture
    # as the existing golden-cose.json entry — fixtures are reproducible
    # output of Rust core test harnesses, not real secrets.
    '''packages/extension/tests/.*''',
    # Spec-driven workflow artefacts. Narrowed from the previous blanket
    # `work/.*` allowlist (Wave 5 security audit finding 3): only markdown
    # docs and JSON test fixtures under `work/` are allowed to quote the
    # synthetic JWT/pubkey fixtures verbatim. Any other file type under
    # `work/` (e.g. a stray `.json` install-config snapshot or a `.txt`
    # paste of a real install URL) is now scanned normally.
    '''work/.*\.md$''',
    '''work/.*/tests/fixtures/.*\.json$''',
]
