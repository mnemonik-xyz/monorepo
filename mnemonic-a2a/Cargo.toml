[package]
name = "mnemonic-a2a"
version = "0.1.0"
edition = "2021"
description = "Mnemonic Protocol A2A adapter — attests, stores, and verifies A2A wire objects"

[dependencies]
mnemonic-core = { path = "../core", features = ["a2a-experimental"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
solana-sdk = "2.2"
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }

[dev-dependencies]
