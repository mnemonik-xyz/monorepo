name: fabric-vm-ssh
description: >
  Join the tailnet as an ephemeral node and prepare plain-SSH access to the
  coding-fabric VM (Hetzner, tailnet-only ingress). The VM's Hetzner firewall
  blocks public TCP/22 — GitHub runners MUST come in over Tailscale, the same
  path coding-fabric's deploy-fabric.yml and e2e-smoke.yml use. Auth reuses
  the SAME two secrets as the coding-fabric repo (copy their values into this
  repo's secrets):
    - TAILSCALE_AUTH_KEY  — reusable auth key with tag:fabric baked in
    - CI_SSH_PRIVATE_KEY  — stable Ed25519 key; matching pubkey is in
                            op@VM:~/.ssh/authorized_keys via cloud-init
  Exports to $GITHUB_ENV for downstream steps:
    VM_IP      — the VM's tailnet IPv4 (100.x)
    VM_TARGET  — user@VM_IP, ready for ssh/scp
    SSH_OPTS   — key + host-key options for ssh/scp invocations

inputs:
  tailscale-authkey:
    description: Tailscale reusable auth key (TAILSCALE_AUTH_KEY secret)
    required: true
  ssh-private-key:
    description: Stable CI SSH private key (CI_SSH_PRIVATE_KEY secret)
    required: true
  vm-hostname:
    description: Tailnet HostName of the target VM
    required: false
    default: mnemonic-fabric
  ssh-user:
    description: SSH user on the VM (cloud-init-provisioned op user)
    required: false
    default: op

runs:
  using: composite
  steps:
    - name: Tailscale up (ephemeral)
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ inputs.tailscale-authkey }}
        args: --accept-dns --hostname=gh-runner-${{ github.run_id }}

    - name: Assert runner is on tailnet
      shell: bash
      run: |
        # The tailscale action retries 5 times then exits 0 even if all
        # attempts fail — verify connectivity ourselves so downstream steps
        # fail fast (same guard as coding-fabric deploy-fabric.yml).
        if ! tailscale status >/dev/null 2>&1; then
          echo "::error::tailscale is not running on the runner"
          exit 1
        fi
        STATE=$(tailscale status 2>&1 | head -1)
        if [[ "$STATE" == *"Logged out"* ]] || [[ "$STATE" == *"stopped"* ]]; then
          echo "::error::tailscaled is up but not authenticated ($STATE)"
          exit 1
        fi
        echo "Runner tailnet IPv4: $(tailscale ip -4 2>/dev/null | head -1)"

    - name: Resolve VM tailnet IPv4 (poll up to 5 min)
      shell: bash
      env:
        SERVER_NAME: ${{ inputs.vm-hostname }}
      run: |
        # The tailnet accumulates ghost <hostname>-N devices from prior CI
        # runs; resolving by name returns the OLDEST (usually offline) one.
        # Select ONLY the peer with HostName == SERVER_NAME AND Online ==
        # true from status JSON (pattern proven in deploy-fabric.yml).
        for i in $(seq 1 30); do
          VM_IP=$(tailscale status --json 2>/dev/null | jq -r --arg name "$SERVER_NAME" '
            [(.Peer // {} | to_entries[].value)
              | select(.HostName == $name and .Online == true)
              | (.TailscaleIPs // [])[]
              | select(test("^100\\."))
            ] | first // ""
          ')
          if [ -n "$VM_IP" ]; then
            echo "VM ${SERVER_NAME} resolved to online tailnet IPv4 $VM_IP (try ${i}/30)"
            echo "VM_IP=$VM_IP" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "[$i/30] no ONLINE peer with HostName=${SERVER_NAME} yet — sleeping 10s"
          sleep 10
        done
        echo "::error::no online ${SERVER_NAME} peer appeared within 5 min"
        tailscale status || true
        exit 1

    - name: Load CI SSH private key
      shell: bash
      env:
        CI_SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_USER: ${{ inputs.ssh-user }}
      run: |
        # Tailscale-SSH is intentionally NOT enabled on the VM (conflicts
        # with OpenSSH on 22 + interactive auth deadlocks CI). Plain SSH
        # over the tailnet interface with the stable CI key — same auth
        # path coding-fabric's Ansible and e2e-smoke use.
        # run 29099690819 died SILENTLY (no output at all) here: a failed
        # grep inside a direct `var=$(...)` assignment kills the script
        # under `set -e` with zero diagnostics, unlike a substitution used
        # inside an `if [ ... ]` test (which IS exempt from errexit). Trap
        # ERR so any future silent-death mode at least prints a line number
        # instead of vanishing.
        trap 'echo "::error::fabric-vm-ssh key-loading step aborted at line $LINENO — this is a bug in the normalization script itself, not necessarily bad secret content. Report the line number."' ERR

        if [ -z "$CI_SSH_PRIVATE_KEY" ]; then
          echo "::error::ssh-private-key input is empty"
          exit 1
        fi
        # Normalize common paste-manglings of the secret (run 29097318643
        # died with 'error in libcrypto' — a format problem, not auth):
        #  - surrounding quotes, CRLF line endings
        #  - literal backslash-n sequences instead of real newlines
        #  - the whole key on ONE line with spaces where newlines belong
        printf '%s\n' "$CI_SSH_PRIVATE_KEY" \
          | sed -e '1s/^"//' -e '$s/"$//' | tr -d '\r' > /tmp/ci_deploy_key
        if grep -q '\\n' /tmp/ci_deploy_key; then
          sed -i 's/\\n/\n/g' /tmp/ci_deploy_key
        fi
        if [ "$(grep -c . /tmp/ci_deploy_key)" -le 1 ] \
           && grep -q -- '-----BEGIN' /tmp/ci_deploy_key; then
          # `|| true` on every substitution here: a non-matching grep must
          # NOT kill the script (see trap comment above) — fall through to
          # the ssh-keygen validation below instead, which reports failure
          # with an explicit, readable message.
          header=$(grep -o -- '-----BEGIN [A-Z0-9 ]*-----' /tmp/ci_deploy_key | head -1 || true)
          footer=$(grep -o -- '-----END [A-Z0-9 ]*-----' /tmp/ci_deploy_key | head -1 || true)
          if [ -n "$header" ] && [ -n "$footer" ]; then
            body=$(sed -e "s/.*$header//" -e "s/$footer.*//" /tmp/ci_deploy_key \
                   | tr ' ' '\n' | grep -v '^$' || true)
            { echo "$header"; echo "$body"; echo "$footer"; } > /tmp/ci_deploy_key
          else
            echo "::warning::key looks like a single collapsed line but no -----BEGIN/END----- markers matched the expected format — leaving as-is, validation below will report the precise failure"
          fi
        fi
        chmod 600 /tmp/ci_deploy_key
        # Fail HERE with a precise message rather than an opaque libcrypto
        # error at ssh time.
        if ! ssh-keygen -y -P '' -f /tmp/ci_deploy_key > /dev/null 2>&1; then
          echo "::error::CI_SSH_PRIVATE_KEY does not parse as an (unencrypted) SSH private key even after normalization. Re-copy the key file byte-for-byte from the coding-fabric secret source: gh secret set CI_SSH_PRIVATE_KEY -R <this repo> < /path/to/key"
          ssh-keygen -y -P '' -f /tmp/ci_deploy_key 2>&1 | head -3 || true
          # Diagnostics that reveal the SHAPE of the problem without ever
          # printing secret content: GitHub's log masking only catches
          # exact matches of the WHOLE registered secret, so echoing a raw
          # substring (even a prefix) would risk leaking it — everything
          # below is a derived count/hash/boolean instead.
          echo "::notice::diagnostics (no key content shown) — byte_len=$(wc -c < /tmp/ci_deploy_key) sha256=$(sha256sum /tmp/ci_deploy_key | cut -d' ' -f1) lines=$(wc -l < /tmp/ci_deploy_key)"
          if grep -qE '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-|ssh-dss) ' /tmp/ci_deploy_key; then
            echo "::error::the secret looks like a PUBLIC key (starts with ssh-<type>) — CI_SSH_PRIVATE_KEY must hold the PRIVATE half, not the .pub file"
          elif grep -qiE '^age1|AGE-SECRET-KEY|age-encryption\.org' /tmp/ci_deploy_key; then
            echo "::error::the secret looks like an age key/blob (sops encryption), not a plaintext SSH private key — CI_SSH_PRIVATE_KEY must be the DECRYPTED key, not the encrypted artifact"
          elif grep -qE '^[A-Za-z0-9+/=]+$' /tmp/ci_deploy_key; then
            echo "::error::the secret looks like a single base64 blob with no PEM markers at all — did the copy strip the -----BEGIN/END----- lines?"
          elif [ "$(wc -c < /tmp/ci_deploy_key)" -lt 100 ]; then
            echo "::error::the secret is suspiciously short ($(wc -c < /tmp/ci_deploy_key) bytes) for an SSH private key — looks truncated"
          fi
          exit 1
        fi
        echo "CI keypair restored (fp $(ssh-keygen -lf /tmp/ci_deploy_key | awk '{print $2}'))"
        echo "VM_TARGET=${SSH_USER}@${VM_IP}" >> "$GITHUB_ENV"
        echo "SSH_OPTS=-i /tmp/ci_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/ci_known_hosts -o ConnectTimeout=15" >> "$GITHUB_ENV"
