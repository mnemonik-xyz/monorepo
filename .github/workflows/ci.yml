name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'work/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'work/**'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      # `keyring` v3's `sync-secret-service` feature (selected in
      # core/Cargo.toml so the Rust mcp-server can talk to Linux Secret
      # Service) transitively pulls in `libdbus-sys`, whose build script
      # needs the `libdbus-1` system library + pkg-config. Ubuntu runners
      # don't ship these by default.
      - name: Install Linux Rust system deps (libdbus-1 for keyring crate)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Lint the production surface (lib + bins, no integration tests).
      - run: cargo clippy --workspace --lib --bins -- -D warnings
      # Then lint everything (incl. mcp/tests/*.rs) with test-support so the
      # new integration tests' clippy passes.
      - run: cargo clippy --workspace --all-targets --features mnemonic-mcp/test-support -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      # See clippy job for context on libdbus-1-dev.
      - name: Install Linux Rust system deps (libdbus-1 for keyring crate)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Workspace tests including the 12 mcp/tests/*.rs integration files
      # (Task 8 — see work/mnemonic-integrations/tasks/8.md). The
      # `mnemonic-mcp/test-support` feature flag activates the
      # `mock_state()` + `mint_jwt()` helpers used by tests.
      - run: cargo test --workspace --no-fail-fast --features mnemonic-mcp/test-support

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      # `--config .gitleaks.toml` extends the default ruleset with a
      # path allowlist for test fixtures (synthetic JWTs / pubkeys) so
      # the gate flags real secrets and stays quiet on intentionally
      # fake test data. See `.gitleaks.toml` for the rationale.
      - name: Scan working tree
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
      - name: Scan full git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --log-opts='--all'

  # ── Task 8 additions ──────────────────────────────────────────────────────
  # Two PR-gating additions remain here: cargo audit (CVE pickup) and
  # smithery.yaml schema validation. The third — `mcp-inspector` — has
  # moved to `.github/workflows/nightly.yml` because (a) it tracks MCP
  # spec drift on a release cadence PR authors can't influence and
  # (b) it's the slowest gate (~3min Rust build + fastembed ONNX
  # download). See that workflow for the pin rationale.

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # `--deny warnings` upgrades unmaintained-crate warnings into errors.
        # Documented exceptions live in `.cargo/audit.toml` — the path
        # cargo-audit loads by default. Schema:
        # `[advisories] ignore = ["RUSTSEC-XXXX-YYYY"]`.
        run: cargo audit --deny warnings

  smithery-schema:
    name: smithery-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned to 3.13 — yamale 4.x relies on `ast.Num` which was
          # removed in Python 3.12+ runtime modules and absent in 3.14
          # (see CPython "Deprecated since 3.12, removed in 3.14"). The
          # default `3.x` resolved to 3.14 on the runner and crashed
          # at schema-load time with `module 'ast' has no attribute 'Num'`.
          # Pin until upstream yamale ships a fix or we move to a
          # different schema validator.
          python-version: '3.13'
      - name: Install yamale
        run: pip install 'yamale==4.*'
      - name: Validate smithery.yaml against schema
        run: yamale -s scripts/smithery-schema.yaml smithery.yaml

  # Webapp gates — vitest unit tests + tsc typecheck.
  #
  # Why this exists: on 2026-05-02 commits a5ee738 and 2fad606 broke the
  # VS Code MCP install deeplink for every user (URL-form regression +
  # JWT-headers regression). Both shipped because the webapp had NO CI
  # coverage — vitest unit tests had to be run manually, the Playwright
  # e2e (which would have caught it) also wasn't gated. Adding this gate
  # so install-button regressions are caught before merge, not in prod.
  webapp:
    name: webapp (vitest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm ci` because the lockfile lives at repo root.
      # `npm install --no-audit --no-fund` resolves devDeps from webapp/package.json.
      - name: Install webapp deps
        run: npm install --no-audit --no-fund
      # Typecheck. Catches drifted types (e.g. removed exports referenced
      # by tests) without running the WASM build pipeline.
      - name: Typecheck
        run: npx tsc -b --noEmit
      # Vitest — scoped to InstallButtons for now. The full suite has a
      # pre-existing flake in Sign.test.tsx (`countdown_displays_mm_ss`,
      # timer race) that fails on `dev` too — broaden this run to
      # `npx vitest run` once that's fixed.
      #
      # The InstallButtons.test.tsx file holds the regression guards
      # against the 2026-05-02 install-deeplink breakages:
      #   - opaque vs hierarchical URL form (`vscode:` vs `vscode://`)
      #   - extra `headers` field in the install JSON
      - name: Vitest (InstallButtons regression guards)
        run: npx vitest run src/components/InstallButtons.test.tsx

  # Optional opt-in job: runs the network-touching `stdio_backward_compat`
  # integration test that's `#[ignore]`d by default. Triggered manually via
  # workflow_dispatch or scheduled (daily) — not on every PR — because it
  # depends on outbound HTTPS to uploader.irys.xyz + api.coingecko.com.
  test-stdio:
    name: test-stdio (ignored)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y g++
      - run: |
          cargo test -p mnemonic-mcp --features test-support \
            --test stdio_backward_compat -- --ignored

  # Cross-language keychain interop test (Task 9).
  # Drives both Rust mnemonic-mcp and Node CLI against the same gnome-keyring
  # entry and asserts byte-equality of secrets. Linux+gnome-keyring only;
  # macOS Keychain and Windows Credential Manager are covered by Wave 5
  # manual smoke tests (no free CI runners with those backends).
  # ──────────────────────────────────────────────────────────────────────
  # CI GATE POLICY for cross-language interop
  # ──────────────────────────────────────────────────────────────────────
  # This was previously a single `cross-lang-keychain` job that mixed two
  # concerns with very different stability profiles:
  #   1. Build all the artifacts required to drive the test (rust + sdk +
  #      cli). Deterministic — failures are always actionable.
  #   2. Run the Rust ↔ Node keychain roundtrip under a CI-spawned
  #      gnome-keyring + D-Bus session. Flaky — sub-test B has a known
  #      daemon-coupling issue on Ubuntu 24.04 (see fde7f72 commit
  #      message) that survived 5 rounds of debugging.
  #
  # Mixing them led to a 3-month yo-yo of `continue-on-error: true` being
  # toggled on/off, masking real build regressions (e.g. wasm-pack going
  # missing in the runner — undetected for the entire #151 merge because
  # the gate was off). Now split:
  #   - `cross-lang-build`     → hard required gate. Never continue-on-error.
  #   - `cross-lang-keychain`  → informational. PERMANENTLY continue-on-error
  #                              until the daemon-coupling issue is fixed
  #                              upstream.
  #
  # DO NOT flip `continue-on-error` on either job without first updating
  # the policy section in CLAUDE.md → "## CI gate policy" and getting
  # explicit reviewer sign-off. The previous yo-yo wasted significant CI
  # debugging time and shipped at least one regression to main.
  # ──────────────────────────────────────────────────────────────────────

  cross-lang-build:
    name: cross-lang-build (gate)
    # Hard required gate — every artifact the keychain test would need
    # must build cleanly here. If wasm-pack is missing, if a Rust crate
    # fails to compile, if the SDK WASM build breaks, if the CLI tsc
    # fails — this job goes red and PRs block. No continue-on-error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux Rust system deps
        # `libdbus-1-dev pkg-config` for the `keyring` crate's
        # `sync-secret-service` feature via libdbus-sys build script.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install wasm-pack
        # SDK `npm run build` shells out to packages/sdk/scripts/build-wasm.sh
        # which requires wasm-pack on PATH. Version pinned to match
        # release.yml and node-test.yml — keep all three in sync.
        run: cargo install wasm-pack --locked --version 0.14.0 || true
      - name: Build Rust mcp-server + keychain-roundtrip example
        run: |
          cargo build -p mnemonic-mcp
          cargo build -p mnemonic-core --example keychain-roundtrip
      - name: Build Node SDK + CLI (sdk first — cli imports from it)
        run: |
          npm install --workspaces --include-workspace-root --no-audit --no-fund
          npm run build --workspace=@mnemonik-xyz/sdk
          npm run build --workspace=@mnemonik-xyz/cli

  cross-lang-keychain:
    name: cross-lang-keychain (informational)
    needs: cross-lang-build
    # PERMANENT: see "CI GATE POLICY" comment block above this job and the
    # matching CLAUDE.md "## CI gate policy" section. The gnome-keyring
    # daemon-coupling issue (sub-test B) is the reason. Do not flip.
    continue-on-error: true
    # Upgraded from ubuntu-22.04 → ubuntu-latest (24.04) because `wasm-pack`
    # caches in Swatinem rust-cache@v2 are now built against GLIBC 2.39.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install gnome-keyring + tools
        # `libdbus-1-dev pkg-config` here too — the cross-lang job builds
        # the same Rust workspace as `clippy`/`test`, hence triggers the
        # `libdbus-sys` build script via `keyring`'s
        # `sync-secret-service` feature.
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-tools jq libdbus-1-dev pkg-config
      - name: Install wasm-pack
        # Same install as cross-lang-build — rust-cache makes this a fast
        # no-op when the binary is already present from the prior job.
        run: cargo install wasm-pack --locked --version 0.14.0 || true
      - name: Build Rust mcp-server + keychain-roundtrip example
        # cargo recompile is near-free thanks to the shared rust-cache.
        run: |
          cargo build -p mnemonic-mcp
          cargo build -p mnemonic-core --example keychain-roundtrip
      - name: Build Node SDK + CLI (sdk first — cli imports from it)
        # npm install + sdk WASM rebuild repeats here (~30s). Acceptable
        # cost for keeping the test job self-contained vs. plumbing
        # artifact upload/download.
        run: |
          npm install --workspaces --include-workspace-root --no-audit --no-fund
          npm run build --workspace=@mnemonik-xyz/sdk
          npm run build --workspace=@mnemonik-xyz/cli
      - name: Run cross-lang test under dbus + keyring
        env:
          MNEMONIC_QUIET: '1'
          STORAGE_MODE: local
          PAYMENT_MODE: none
          EMBED_PROVIDER: openai
          OPENAI_API_KEY: test
        # Use `dbus-run-session` to spawn a fresh, isolated D-Bus session
        # bus with DBUS_SESSION_BUS_ADDRESS already exported in its child
        # environment — works around the Ubuntu 24.04 gnome-keyring 46+
        # changes that broke the older `dbus-launch + gnome-keyring-daemon
        # --start &` recipe. Inside the subshell we start gnome-keyring's
        # secrets component, wait up to 10s for it to register on the bus,
        # and then run the cross-lang script. If the daemon never registers
        # we exit immediately with a clear diagnostic instead of trying the
        # test and seeing a downstream NoStorageAccess.
        run: |
          dbus-run-session -- bash -eo pipefail -c '
            # Start the secrets-only keyring daemon. `--daemonize` returns
            # control once the daemon has forked. `--unlock` reads an empty
            # password from /dev/null (treated as "no master password" → an
            # unlocked default collection is created on demand).
            gnome-keyring-daemon --start --components=secrets --unlock </dev/null

            # Poll the bus for org.freedesktop.secrets up to 10× 1s.
            for i in $(seq 1 10); do
              if dbus-send --session --dest=org.freedesktop.DBus \
                   --type=method_call --print-reply \
                   /org/freedesktop/DBus org.freedesktop.DBus.ListNames \
                   2>/dev/null | grep -q org.freedesktop.secrets; then
                echo "gnome-keyring secrets service registered (after ${i}s)"
                break
              fi
              sleep 1
            done

            # Final verification — fail loud if still missing after 10s.
            dbus-send --session --dest=org.freedesktop.DBus \
              --type=method_call --print-reply \
              /org/freedesktop/DBus org.freedesktop.DBus.ListNames \
              | grep -q org.freedesktop.secrets \
              || { echo "gnome-keyring secrets service never appeared on D-Bus" >&2; exit 1; }

            bash tests/cross-lang/keychain.sh
          '
