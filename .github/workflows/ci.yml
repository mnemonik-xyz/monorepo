name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'work/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'work/**'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      # `keyring` v3's `sync-secret-service` feature (selected in
      # core/Cargo.toml so the Rust mcp-server can talk to Linux Secret
      # Service) transitively pulls in `libdbus-sys`, whose build script
      # needs the `libdbus-1` system library + pkg-config. Ubuntu runners
      # don't ship these by default.
      - name: Install Linux Rust system deps (libdbus-1 for keyring crate)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Lint the production surface (lib + bins, no integration tests).
      - run: cargo clippy --workspace --lib --bins -- -D warnings
      # Then lint everything (incl. mcp/tests/*.rs) with test-support so the
      # new integration tests' clippy passes.
      - run: cargo clippy --workspace --all-targets --features mnemonic-mcp/test-support -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      # See clippy job for context on libdbus-1-dev.
      - name: Install Linux Rust system deps (libdbus-1 for keyring crate)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Workspace tests including the 12 mcp/tests/*.rs integration files
      # (Task 8 — see work/mnemonic-integrations/tasks/8.md). The
      # `mnemonic-mcp/test-support` feature flag activates the
      # `mock_state()` + `mint_jwt()` helpers used by tests.
      - run: cargo test --workspace --no-fail-fast --features mnemonic-mcp/test-support

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      # `--config .gitleaks.toml` extends the default ruleset with a
      # path allowlist for test fixtures (synthetic JWTs / pubkeys) so
      # the gate flags real secrets and stays quiet on intentionally
      # fake test data. See `.gitleaks.toml` for the rationale.
      - name: Scan working tree
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
      - name: Scan full git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --log-opts='--all'

  # ── Task 8 additions ──────────────────────────────────────────────────────
  # Two PR-gating additions remain here: cargo audit (CVE pickup) and
  # smithery.yaml schema validation. The third — `mcp-inspector` — has
  # moved to `.github/workflows/nightly.yml` because (a) it tracks MCP
  # spec drift on a release cadence PR authors can't influence and
  # (b) it's the slowest gate (~3min Rust build + fastembed ONNX
  # download). See that workflow for the pin rationale.

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # `--deny warnings` upgrades unmaintained-crate warnings into errors.
        # Documented exceptions live in `.cargo/audit.toml` — the path
        # cargo-audit loads by default. Schema:
        # `[advisories] ignore = ["RUSTSEC-XXXX-YYYY"]`.
        run: cargo audit --deny warnings

  smithery-schema:
    name: smithery-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned to 3.13 — yamale 4.x relies on `ast.Num` which was
          # removed in Python 3.12+ runtime modules and absent in 3.14
          # (see CPython "Deprecated since 3.12, removed in 3.14"). The
          # default `3.x` resolved to 3.14 on the runner and crashed
          # at schema-load time with `module 'ast' has no attribute 'Num'`.
          # Pin until upstream yamale ships a fix or we move to a
          # different schema validator.
          python-version: '3.13'
      - name: Install yamale
        run: pip install 'yamale==4.*'
      - name: Validate smithery.yaml against schema
        run: yamale -s scripts/smithery-schema.yaml smithery.yaml

  # Webapp gates — vitest unit tests + tsc typecheck.
  #
  # Why this exists: on 2026-05-02 commits a5ee738 and 2fad606 broke the
  # VS Code MCP install deeplink for every user (URL-form regression +
  # JWT-headers regression). Both shipped because the webapp had NO CI
  # coverage — vitest unit tests had to be run manually, the Playwright
  # e2e (which would have caught it) also wasn't gated. Adding this gate
  # so install-button regressions are caught before merge, not in prod.
  webapp:
    name: webapp (vitest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm ci` because the lockfile lives at repo root.
      # `npm install --no-audit --no-fund` resolves devDeps from webapp/package.json.
      - name: Install webapp deps
        run: npm install --no-audit --no-fund
      # Typecheck. Catches drifted types (e.g. removed exports referenced
      # by tests) without running the WASM build pipeline.
      - name: Typecheck
        run: npx tsc -b --noEmit
      # Vitest — scoped to InstallButtons for now. The full suite has a
      # pre-existing flake in Sign.test.tsx (`countdown_displays_mm_ss`,
      # timer race) that fails on `dev` too — broaden this run to
      # `npx vitest run` once that's fixed.
      #
      # The InstallButtons.test.tsx file holds the regression guards
      # against the 2026-05-02 install-deeplink breakages:
      #   - opaque vs hierarchical URL form (`vscode:` vs `vscode://`)
      #   - extra `headers` field in the install JSON
      - name: Vitest (InstallButtons regression guards)
        run: npx vitest run src/components/InstallButtons.test.tsx

  # Optional opt-in job: runs the network-touching `stdio_backward_compat`
  # integration test that's `#[ignore]`d by default. Triggered manually via
  # workflow_dispatch or scheduled (daily) — not on every PR — because it
  # depends on outbound HTTPS to uploader.irys.xyz + api.coingecko.com.
  test-stdio:
    name: test-stdio (ignored)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y g++
      - run: |
          cargo test -p mnemonic-mcp --features test-support \
            --test stdio_backward_compat -- --ignored

  # Cross-language keychain interop test (Task 9).
  # Drives both Rust mnemonic-mcp and Node CLI against the same gnome-keyring
  # entry and asserts byte-equality of secrets. Linux+gnome-keyring only;
  # macOS Keychain and Windows Credential Manager are covered by Wave 5
  # manual smoke tests (no free CI runners with those backends).
  cross-lang-keychain:
    name: cross-lang-keychain
    # Upgraded from ubuntu-22.04 → ubuntu-latest (24.04) because `wasm-pack`
    # caches in Swatinem rust-cache@v2 are now built against GLIBC 2.39
    # (Ubuntu 24.04). The 22.04 runner ships GLIBC 2.35 → wasm-pack from
    # the cache exits with "GLIBC_2.39 not found". gnome-keyring's
    # behavior is identical on 24.04, so no functional change to the
    # cross-language interop assertions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install gnome-keyring + tools
        # `libdbus-1-dev pkg-config` here too — the cross-lang job builds
        # the same Rust workspace as `clippy`/`test`, hence triggers the
        # `libdbus-sys` build script via `keyring`'s
        # `sync-secret-service` feature.
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-tools jq libdbus-1-dev pkg-config
      - name: Build Rust mcp-server
        run: cargo build -p mnemonic-mcp
      - name: Build Node CLI (sdk first — cli imports from it)
        run: |
          npm install --workspaces --include-workspace-root --no-audit --no-fund
          npm run build --workspace=@mnemonik-xyz/sdk
          npm run build --workspace=@mnemonik-xyz/cli
      - name: Run cross-lang test under dbus + keyring
        env:
          MNEMONIC_QUIET: '1'
          STORAGE_MODE: local
          PAYMENT_MODE: none
          EMBED_PROVIDER: openai
          OPENAI_API_KEY: test
        run: |
          eval "$(dbus-launch --sh-syntax)"
          echo -n "" | gnome-keyring-daemon --unlock
          gnome-keyring-daemon --start --components=secrets &
          sleep 1
          bash tests/cross-lang/keychain.sh
