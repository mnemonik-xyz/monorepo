name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'work/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'work/**'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      # Lint the production surface (lib + bins, no integration tests).
      - run: cargo clippy --workspace --lib --bins -- -D warnings
      # Then lint everything (incl. mcp/tests/*.rs) with test-support so the
      # new integration tests' clippy passes.
      - run: cargo clippy --workspace --all-targets --features mnemonic-mcp/test-support -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      # Workspace tests including the 12 mcp/tests/*.rs integration files
      # (Task 8 — see work/mnemonic-integrations/tasks/8.md). The
      # `mnemonic-mcp/test-support` feature flag activates the
      # `mock_state()` + `mint_jwt()` helpers used by tests.
      - run: cargo test --workspace --no-fail-fast --features mnemonic-mcp/test-support

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan working tree
        run: gitleaks detect --source . --redact --no-banner --verbose
      - name: Scan full git history
        run: gitleaks detect --source . --redact --no-banner --log-opts='--all'

  # ── Task 8 additions ──────────────────────────────────────────────────────
  # Three new gates: MCP Inspector validation, cargo audit (CVE pickup), and
  # smithery.yaml schema validation.

  mcp-inspector:
    name: mcp-inspector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build deps (g++ for fastembed local-embed)
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Build mnemonic-mcp + mint-test-jwt
        run: |
          cargo build -p mnemonic-mcp --features local-embed --bin mnemonic-mcp
          cargo build -p mnemonic-mcp --features test-support --bin mint-test-jwt
      - name: Generate JWT secret + test token
        id: jwt
        run: |
          # 32-byte random base64 secret.
          SECRET="$(openssl rand -base64 32)"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"
          # Mint a JWT for the canonical CI subject.
          TOKEN="$(MCP_JWT_SECRET="$SECRET" \
            ./target/debug/mint-test-jwt --sub ci-test)"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Start mcp server
        env:
          STORAGE_MODE: local
          PAYMENT_MODE: none
          # local-embed is compiled in; fastembed downloads the ONNX model
          # on first run (~22MB). ONNX model is cached by rust-cache via the
          # ~/.cache/fastembed dir on subsequent runs.
          EMBED_PROVIDER: fastembed
          MCP_JWT_SECRET: ${{ steps.jwt.outputs.secret }}
          MNEMONIC_KEYPAIR_PATH: /tmp/ci-mcp-id.json
          DATABASE_PATH: /tmp/ci-mcp.db
          RAG_CHUNK_DIR: /tmp/ci-rag
        run: |
          mkdir -p /tmp/ci-rag
          ./target/debug/mnemonic-mcp --transport http --port 3000 &
          echo $! > /tmp/mcp.pid
      - name: Wait for /health (30s timeout)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "/health up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "/health never came up"
          # Surface mcp logs for debugging.
          if [ -f /tmp/mcp.pid ]; then kill "$(cat /tmp/mcp.pid)" 2>/dev/null || true; fi
          exit 1
      - name: Validate MCP server with @modelcontextprotocol/inspector
        run: |
          # Pinned to 0.6.x — bump in tandem with MCP spec releases.
          # Inspector returns non-zero on validation errors.
          npx --yes @modelcontextprotocol/inspector@0.6.x \
            --validate http://localhost:3000/mcp \
            -H "Authorization: Bearer ${{ steps.jwt.outputs.token }}" \
            || (echo "MCP Inspector validation failed"; exit 1)
      - name: Stop mcp server
        if: always()
        run: |
          if [ -f /tmp/mcp.pid ]; then kill "$(cat /tmp/mcp.pid)" 2>/dev/null || true; fi

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # `--deny warnings` upgrades unmaintained-crate warnings into errors.
        # Documented exceptions live in `audit.toml` at the repo root
        # (`[advisories] ignore = ["RUSTSEC-XXXX-YYYY"]`).
        run: cargo audit --deny warnings

  smithery-schema:
    name: smithery-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install yamale
        run: pip install 'yamale==4.*'
      - name: Validate smithery.yaml against schema
        run: yamale -s scripts/smithery-schema.yaml smithery.yaml

  # Optional opt-in job: runs the network-touching `stdio_backward_compat`
  # integration test that's `#[ignore]`d by default. Triggered manually via
  # workflow_dispatch or scheduled (daily) — not on every PR — because it
  # depends on outbound HTTPS to uploader.irys.xyz + api.coingecko.com.
  test-stdio:
    name: test-stdio (ignored)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y g++
      - run: |
          cargo test -p mnemonic-mcp --features test-support \
            --test stdio_backward_compat -- --ignored
