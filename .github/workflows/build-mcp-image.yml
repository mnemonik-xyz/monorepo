name: Build MCP image

# Builds the production mnemonic-mcp container (mcp/Dockerfile: g++/local-embed,
# docs/ baked in) and pushes it to GHCR so the VPS pulls a ready image instead
# of compiling Rust on a 4 GB box. The compose stack references
# ghcr.io/<owner>/mnemonic-mcp — this is what populates it.
#
# Triggers:
#   * push to main      → tag `latest` + `sha-<short>`
#   * push tag v*       → tag `vX.Y.Z` + `latest`
#   * manual dispatch   → tag `latest`
# Deploy (deploy-mcp.yml) is still a separate manual step — building an image
# does NOT ship it.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only rebuild when something in the image actually changes.
    paths:
      - "core/**"
      - "mcp/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/build-mcp-image.yml"
  workflow_dispatch:

concurrency:
  group: build-mcp-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mnemonic-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
