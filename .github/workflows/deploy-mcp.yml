name: Deploy MCP

# Ships the containerized mnemonic-mcp stack to the production VPS — the
# coding-fabric Hetzner VM (tailnet HostName `mnemonic-fabric`), which also
# serves mcp.mnemonik.xyz via its Caddy. The image is built + pushed to GHCR
# by build-mcp-image.yml — this workflow only PULLS it and swaps the running
# container, so no Rust compiles on the box.
#
# ACCESS PATH (no public SSH): the VM's Hetzner firewall blocks TCP/22 from
# the internet — direct SSH from a GitHub runner times out (run 29026141051).
# The runner joins the tailnet as an ephemeral node and SSHes over the
# tailnet interface as op@<tailnet-ip>, exactly like coding-fabric's
# deploy-fabric.yml / e2e-smoke.yml. See .github/actions/fabric-vm-ssh.
#
# Required repo secrets (same VALUES as the coding-fabric repo's secrets):
#   TAILSCALE_AUTH_KEY  — reusable tailnet auth key (tag:fabric baked in)
#   CI_SSH_PRIVATE_KEY  — stable CI Ed25519 key, pubkey on op@VM
# Optional repo variables:
#   FABRIC_VM_HOSTNAME  — tailnet HostName of the VM (default mnemonic-fabric)
#   MCP_VM_STACK_DIR    — coding-fabric-rendered stack (default /opt/mnemonik-server)
#   MCP_VM_SSH_USER     — SSH user (default op)
#
# CODING-FABRIC OWNERSHIP: coding-fabric renders /opt/mnemonik-server with the
# live persistent data mounts and shared Caddy network. This workflow detects
# and reuses that stack's Compose project. It must never deploy the monorepo's
# standalone docker-compose.yml on the fabric VM or create new data volumes.
#
# Trigger model: manual-only (workflow_dispatch). Pick apply / smoke / rollback.
# Auto-deploy on tag is intentionally disabled — the prod ship stays with a human.
#
# Job coupling policy: this workflow verifies the MCP surface only (/health,
# OAuth discovery, tools/list, /stats). The webapp/chat UX is NOT checked
# here — `smoke_chat` is an explicit opt-in for the /chat endpoint.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'apply (deploy), smoke (verify only), or rollback'
        type: choice
        required: true
        default: smoke
        options: [apply, smoke, rollback]
      ref:
        description: 'git ref for compose files AND the image tag: main -> :latest, vX.Y.Z -> :vX.Y.Z'
        type: string
        required: false
        default: main
      force_reseed:
        description: 'Set MNEMONIC_FORCE_RESEED=1 for one boot so docs/ changes propagate to the chat corpus.'
        type: boolean
        required: false
        default: true
      smoke_chat:
        description: 'Also smoke the /chat endpoint (LLM round-trip; slow, needs warm ollama). Off by default — chat is a webapp-facing concern.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-mcp-prod
  cancel-in-progress: false

env:
  PROD_HEALTH_URL: https://mcp.mnemonik.xyz/health
  PROD_DISCOVERY_URL: https://mcp.mnemonik.xyz/.well-known/oauth-authorization-server
  PROD_MCP_URL: https://mcp.mnemonik.xyz/mcp

jobs:
  deploy:
    name: Deploy or rollback over tailnet SSH (compose)
    if: ${{ inputs.action == 'apply' || inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify required secrets are present
        run: |
          for var in TAILSCALE_AUTH_KEY CI_SSH_PRIVATE_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: $var (copy the value from the coding-fabric repo's secrets)"
              exit 1
            fi
          done
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          CI_SSH_PRIVATE_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}

      # Local composite actions need the repo on disk first.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Join tailnet + prepare SSH to the fabric VM
        uses: ./.github/actions/fabric-vm-ssh
        with:
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          ssh-private-key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          vm-hostname: ${{ vars.FABRIC_VM_HOSTNAME || 'mnemonic-fabric' }}
          ssh-user: ${{ vars.MCP_VM_SSH_USER || 'op' }}

      - name: Deploy or rollback on VPS
        env:
          ACTION: ${{ inputs.action }}
          REF: ${{ inputs.ref }}
          FORCE_RESEED: ${{ inputs.force_reseed }}
          STACK_DIR: ${{ vars.MCP_VM_STACK_DIR || '/opt/mnemonik-server' }}
          CADDY_NETWORK_NAME: ${{ vars.CADDY_NETWORK_NAME || 'vaultwarden_vaultwarden' }}
          CHAIN_STATS_WALLETS: ${{ vars.CHAIN_STATS_WALLETS || 'DYVu4Bry3BzGVsR3Hj2iGVT5fNdWFoHw2zRxsdTmrG25' }}
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
        run: |
          set -euo pipefail
          STACK_DIR="$(echo "$STACK_DIR" | xargs)"
          case "$STACK_DIR" in
            /?*) ;;
            *) echo "::error::MCP_VM_STACK_DIR must be an absolute path on the VM (got '$STACK_DIR')"; exit 1 ;;
          esac
          # SSH_OPTS is an argument bundle emitted by fabric-vm-ssh. The
          # heredoc deliberately expands workflow values on the runner while
          # escaped runtime values expand on the VM.
          # shellcheck disable=SC2086,SC2087
          ssh $SSH_OPTS "$VM_TARGET" bash -s <<REMOTE_EOF
          set -euo pipefail
          STACK="${STACK_DIR}"

          if docker info >/dev/null 2>&1; then DOCKER="docker"; else DOCKER="sudo -n docker"; fi

          if [ ! -f "\$STACK/docker-compose.yml" ] || [ ! -f "\$STACK/mcp.env" ]; then
            echo "::error::coding-fabric stack is missing at \$STACK; run coding-fabric's mnemonik-server role first"
            exit 1
          fi
          cd "\$STACK"

          # Reuse the project that owns the live data volumes. The known-good
          # fabric project is mnemonik; the label keeps this safe if renamed.
          PROJ="\$(\$DOCKER inspect mnemonik-mcp-1 --format '{{index .Config.Labels "com.docker.compose.project"}}' 2>/dev/null || true)"
          PROJ="\${PROJ:-mnemonik}"
          echo "compose project: \$PROJ"

          case "${REF}" in
            v*|sha-*) IMAGE_TAG="${REF}" ;;
            *)        IMAGE_TAG="latest" ;;
          esac
          OLD_TAG="\$(grep -oE 'mnemonic-mcp:[A-Za-z0-9._-]+' docker-compose.yml | head -1 | cut -d: -f2)"
          echo "Image tag: \$OLD_TAG -> \$IMAGE_TAG (action=${ACTION})"

          # Validate the fabric compose shape structurally. Both bind mounts
          # and existing named volumes are valid; the critical invariant is
          # that this project mounts persistent storage at /data and /keypair.
          COMPOSE_JSON="\$(\$DOCKER compose -p "\$PROJ" config --format json)"
          python3 -c 'import json,sys; c=json.load(sys.stdin); v=c["services"]["mcp"].get("volumes", []); assert any(x.get("target")=="/data" and x.get("type") in ("bind","volume") for x in v); assert any(x.get("target")=="/keypair" and x.get("type") in ("bind","volume") for x in v)' <<< "\$COMPOSE_JSON" \
            || { echo "::error::persistent /data or /keypair mount is missing"; exit 1; }
          \$DOCKER network inspect "${CADDY_NETWORK_NAME}" >/dev/null

          # Remove containers from the accidental monorepo-owned project. Do
          # not pass -v: its volumes are retained for forensic recovery.
          ROGUE_IDS="\$(\$DOCKER ps -aq --filter label=com.docker.compose.project=mnemonik-server)"
          if [ -n "\$ROGUE_IDS" ]; then
            echo "Removing accidental mnemonik-server containers (volumes retained)"
            \$DOCKER rm -f \$ROGUE_IDS
          fi

          # The fabric compose file pins the image tag. Update that one field
          # in place, matching coding-fabric's own deploy-mnemonic-mcp workflow.
          sed -i -E "s|(ghcr.io/mnemonik-xyz/mnemonic-mcp:)[A-Za-z0-9._-]+|\1\$IMAGE_TAG|" docker-compose.yml

          RESEED_ADDED=0
          cleanup_reseed() {
            if [ "\$RESEED_ADDED" = "1" ]; then
              sed -i '/^MNEMONIC_FORCE_RESEED=/d' "\$STACK/mcp.env"
            fi
          }
          trap cleanup_reseed EXIT
          if [ "${FORCE_RESEED}" = "true" ]; then
            sed -i '/^MNEMONIC_FORCE_RESEED=/d' "\$STACK/mcp.env"
            echo "MNEMONIC_FORCE_RESEED=1" >> "\$STACK/mcp.env"
            RESEED_ADDED=1
          fi
          sed -i '/^CHAIN_STATS_WALLETS=/d' "\$STACK/mcp.env"
          echo "CHAIN_STATS_WALLETS=${CHAIN_STATS_WALLETS}" >> "\$STACK/mcp.env"
          sed -i '/^SOLANA_RPC_URL=/d' "\$STACK/mcp.env"
          echo "SOLANA_RPC_URL=${SOLANA_RPC_URL}" >> "\$STACK/mcp.env"

          echo "::group::recreate coding-fabric MCP service"
          \$DOCKER compose -p "\$PROJ" pull mcp
          \$DOCKER compose -p "\$PROJ" up -d --force-recreate mcp
          echo "::endgroup::"

          echo "::group::wait for mcp health"
          cid="\$(\$DOCKER compose -p "\$PROJ" ps -q mcp)"
          ok=0
          status=starting
          for i in \$(seq 1 72); do
            status="\$(\$DOCKER inspect --format '{{.State.Health.Status}}' "\$cid" 2>/dev/null || echo starting)"
            if [ "\$status" = "healthy" ]; then ok=1; break; fi
            if [ "\$status" = "unhealthy" ]; then break; fi
            sleep 5
          done
          if [ "\$ok" != "1" ]; then
            echo "::error::mcp container did not become healthy (status=\$status)"
            \$DOCKER compose -p "\$PROJ" logs --tail 80 mcp || true
            exit 1
          fi
          echo "mcp healthy (tag \$IMAGE_TAG)"
          echo "::endgroup::"

          cleanup_reseed
          RESEED_ADDED=0
          trap - EXIT

          \$DOCKER image prune -f >/dev/null 2>&1 || true
          echo "::group::seed log tail"
          \$DOCKER compose -p "\$PROJ" logs --since 120s mcp \
            | grep -iE 'seed|protocol-knowledge|Identity:|listening|chain-stats' || true
          echo "::endgroup::"
          REMOTE_EOF

  smoke:
    name: Post-deploy smoke (MCP surface only)
    needs: deploy
    if: ${{ always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /health
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "$PROD_HEALTH_URL" | tee /tmp/health.json
          test "$(jq -r .status </tmp/health.json)" = "ok"

      - name: OAuth discovery advertises both grants
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "$PROD_DISCOVERY_URL" | tee /tmp/discovery.json
          jq -e '.grant_types_supported | index("authorization_code") and index("refresh_token")' \
            </tmp/discovery.json >/dev/null

      - name: Anonymous tools/list returns the full set
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          curl -fsS --max-time 10 -X POST "$PROD_MCP_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            | jq -e '(.result.tools | length) >= 7' >/dev/null

      - name: On-node and chain-backed memories are live
        run: |
          set -euo pipefail
          # The snapshot loads at startup (immediate refresh), so a couple of
          # minutes covers RPC + payload fetches. Requiring both counters also
          # proves that the server opened coding-fabric's persistent SQLite
          # bind mount instead of a fresh Docker named volume.
          for _ in $(seq 1 12); do
            curl -fsS --max-time 10 "https://mcp.mnemonik.xyz/stats" >/tmp/stats.json 2>/dev/null || true
            if jq -e '.saved_on_node >= 1 and .saved_onchain >= 1' </tmp/stats.json >/dev/null 2>&1; then
              echo "memory stats live: $(cat /tmp/stats.json)"
              exit 0
            fi
            sleep 10
          done
          cat /tmp/stats.json 2>/dev/null || true
          echo "::error::on-node or chain-backed memories are missing — verify the persistent /mnemonik/data bind mount, then check chain-stats RPC/gateway logs"
          exit 1

      - name: Chat returns non-empty context-grounded response (opt-in)
        # Chat is a webapp-facing feature (LLM round-trip via ollama) — it is
        # NOT part of the default MCP deploy gate. Enable with the smoke_chat
        # input when a deploy specifically targets the chat/RAG path.
        if: ${{ inputs.smoke_chat }}
        run: |
          set -euo pipefail
          payload='{"message":"What is the Mnemonic Protocol?","session_id":"deploy-smoke"}'
          response=$(curl -fsS --max-time 30 -X POST \
            "https://mcp.mnemonik.xyz/chat" \
            -H 'Content-Type: application/json' \
            -d "$payload")
          echo "$response" | jq .
          test -n "$(echo "$response" | jq -r '.response // empty')"
