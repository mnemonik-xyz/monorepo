name: Deploy MCP

# Ships the containerized mnemonic-mcp stack to the production VPS
# (mcp.mnemonik.xyz / mnemonik.xyz). The image is built + pushed to GHCR by
# build-mcp-image.yml — this workflow only PULLS it and swaps the running
# container, so no Rust compiles on the 4 GB box.
#
# Trigger model: manual-only (workflow_dispatch). Pick apply / smoke / rollback.
# Auto-deploy on tag is intentionally disabled — the prod ship stays with a human.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'apply (deploy), smoke (verify only), or rollback'
        type: choice
        required: true
        default: smoke
        options: [apply, smoke, rollback]
      ref:
        description: 'git ref for compose/nginx files AND the image tag: main -> :latest, vX.Y.Z -> :vX.Y.Z'
        type: string
        required: false
        default: main
      force_reseed:
        description: 'Set MNEMONIC_FORCE_RESEED=1 for one boot so docs/ changes propagate to the chat corpus.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-mcp-prod
  cancel-in-progress: false

env:
  PROD_HEALTH_URL: https://mcp.mnemonik.xyz/health
  PROD_DISCOVERY_URL: https://mcp.mnemonik.xyz/.well-known/oauth-authorization-server
  PROD_MCP_URL: https://mcp.mnemonik.xyz/mcp
  WEBAPP_URL: https://mnemonik.xyz

jobs:
  deploy:
    name: Deploy or rollback over SSH (compose)
    if: ${{ inputs.action == 'apply' || inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify required secrets are present
        run: |
          for var in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!var:-}" ]; then echo "::error::Missing required secret: $var"; exit 1; fi
          done
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Configure SSH client
        run: |
          set -euo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_ed25519
          chmod 0600 ~/.ssh/deploy_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - name: Deploy or rollback on VPS
        env:
          ACTION: ${{ inputs.action }}
          REF: ${{ inputs.ref }}
          FORCE_RESEED: ${{ inputs.force_reseed }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_ed25519 -o IdentitiesOnly=yes -o ConnectTimeout=15 \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<REMOTE_EOF
          set -euo pipefail
          REPO=/home/claude/monorepo
          cd "\$REPO"

          echo "::group::sync compose/nginx files to ${REF}"
          git fetch --tags --quiet origin
          git checkout --quiet "${REF}"
          git reset --hard "origin/\$(git symbolic-ref --short HEAD 2>/dev/null || echo ${REF})" 2>/dev/null \
            || git reset --hard "${REF}"
          # Canonical env lives next to the compose file; keep the legacy path working.
          ln -sf "\$REPO/mcp.env" /home/claude/mcp.env
          echo "::endgroup::"

          # Map the git ref to the GHCR image tag: vX.Y.Z -> that tag, else latest.
          case "${REF}" in
            v*) IMAGE_TAG="${REF}" ;;
            *)  IMAGE_TAG="latest" ;;
          esac
          echo "Deploying image tag: \$IMAGE_TAG (action=${ACTION})"
          sed -i '/^MCP_IMAGE_TAG=/d' "\$REPO/mcp.env"
          echo "MCP_IMAGE_TAG=\$IMAGE_TAG" >> "\$REPO/mcp.env"

          if [ "${FORCE_RESEED}" = "true" ]; then
            sed -i '/^MNEMONIC_FORCE_RESEED=/d' "\$REPO/mcp.env"
            echo "MNEMONIC_FORCE_RESEED=1" >> "\$REPO/mcp.env"
          fi

          echo "::group::pull + up"
          docker compose --env-file "\$REPO/mcp.env" pull mcp
          docker compose --env-file "\$REPO/mcp.env" up -d --remove-orphans
          echo "::endgroup::"

          echo "::group::wait for mcp health"
          ok=0
          for i in \$(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          if [ "\$ok" != "1" ]; then
            docker compose --env-file "\$REPO/mcp.env" logs --tail 60 mcp; exit 1
          fi
          echo "mcp healthy"
          echo "::endgroup::"

          if [ "${FORCE_RESEED}" = "true" ]; then
            # Consumed once at boot; drop it so future restarts use mtime idempotency.
            sed -i '/^MNEMONIC_FORCE_RESEED=/d' "\$REPO/mcp.env"
          fi

          docker image prune -f >/dev/null 2>&1 || true
          echo "::group::seed log tail"
          docker compose --env-file "\$REPO/mcp.env" logs --since 60s mcp \
            | grep -iE 'seed|protocol-knowledge|Identity:|listening' || true
          echo "::endgroup::"
          REMOTE_EOF

  smoke:
    name: Post-deploy smoke
    needs: deploy
    if: ${{ always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /health
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "$PROD_HEALTH_URL" | tee /tmp/health.json
          test "$(jq -r .status </tmp/health.json)" = "ok"

      - name: OAuth discovery advertises both grants
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "$PROD_DISCOVERY_URL" | tee /tmp/discovery.json
          jq -e '.grant_types_supported | index("authorization_code") and index("refresh_token")' \
            </tmp/discovery.json >/dev/null

      - name: Anonymous tools/list returns the full set
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          curl -fsS --max-time 10 -X POST "$PROD_MCP_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            | jq -e '(.result.tools | length) >= 7' >/dev/null

      - name: Chat returns non-empty context-grounded response
        run: |
          set -euo pipefail
          payload='{"message":"What is the Mnemonic Protocol?","session_id":"deploy-smoke"}'
          response=$(curl -fsS --max-time 30 -X POST \
            "$WEBAPP_URL/chat" \
            -H 'Content-Type: application/json' \
            -d "$payload")
          echo "$response" | jq .
          test -n "$(echo "$response" | jq -r '.response // empty')"
