name: Deploy Webapp

# Builds the Vite webapp from this monorepo and publishes webapp/dist to
# Cloudflare Pages. The MCP/API surface is hosted separately on the Hetzner
# coding-fabric VM at https://mcp.mnemonik.xyz, so the static bundle is built
# with VITE_MCP_BASE pointing at that origin.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-webapp.yml"
      - "webapp/**"
      - "core/**"
      - "docs/**"

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-webapp-prod
  cancel-in-progress: true

env:
  WEBAPP_URL: https://www.mnemonik.xyz
  VITE_MCP_BASE: https://mcp.mnemonik.xyz

jobs:
  deploy-webapp:
    name: Build and deploy Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci --no-audit --no-fund

      - name: Build webapp
        working-directory: webapp
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mnemonik-webapp
          directory: webapp/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke webapp shell
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 "$WEBAPP_URL/")"
          printf '%s\n' "$body" | head -3
          printf '%s\n' "$body" | grep -qi '<div id="root"\|<html' \
            || { echo "::error::webapp did not return the SPA shell"; exit 1; }
