name: Deploy Webapp

# Verifies the Vite webapp build. Production deploy is handled by the
# Cloudflare Pages Git integration attached to this repo/branch; there are no
# Cloudflare API secrets in GitHub Actions. The MCP/API surface is hosted
# separately on the Hetzner coding-fabric VM at https://mcp.mnemonik.xyz.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-webapp.yml"
      - "webapp/**"
      - "core/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: deploy-webapp-prod
  cancel-in-progress: true

env:
  WEBAPP_URL: https://www.mnemonik.xyz
  VITE_MCP_BASE: https://mcp.mnemonik.xyz

jobs:
  verify-webapp:
    name: Build webapp for Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci --no-audit --no-fund

      - name: Build webapp
        working-directory: webapp
        run: npm run build

      - name: Verify built shell
        working-directory: webapp
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -qi '<div id="root"\|<html' dist/index.html \
            || { echo "::error::webapp build did not produce the SPA shell"; exit 1; }
