name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install dependencies (native x86_64)
        if: matrix.cross == false
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev g++

      - name: Install dependencies (cross aarch64)
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config perl make

      - name: Build
        env:
          OPENSSL_STATIC: ${{ matrix.cross && '1' || '' }}
          OPENSSL_LIB_DIR: ${{ matrix.cross && '' || '' }}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            export OPENSSL_SRC_PERL=/usr/bin/perl
          fi
          cargo build --release --target ${{ matrix.target }} -p mnemonic-mcp --features "openssl-vendored,local-embed"

      - name: Package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="mnemonic-mcp-${tag}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/mnemonic-mcp" "$name/"
          cp README.md "$name/" 2>/dev/null || true
          tar czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  build-macos:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p mnemonic-mcp --features local-embed

      - name: Package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="mnemonic-mcp-${tag}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/mnemonic-mcp" "$name/"
          cp README.md "$name/" 2>/dev/null || true
          tar czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz

  # T11 audit fix (A08) — npm publish with sigstore provenance.
  # Decision 13 + tech-spec acceptance criterion: both @mnemonik-xyz/sdk
  # and @mnemonik-xyz/cli MUST publish with `--provenance` so consumers
  # can verify the package was built from the tagged commit by GitHub
  # Actions (not by a maintainer's laptop).
  publish-npm:
    name: Publish to npm with provenance
    # Decoupled from Rust binary builds — npm packages don't consume Rust
    # binaries, only the SDK's WASM artifact (built locally via wasm-pack
    # in the prepublishOnly hook). Allows npm publish to proceed even if
    # macOS GitHub Actions runners are queue-degraded (Apr 2026 incident).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) requires npm CLI >= 11.5.1. Node 22
      # ships npm 10.x, so upgrade explicitly. Once the global install
      # finishes, subsequent `npm` invocations resolve to the new binary.
      - name: Upgrade npm to >=11.5.1 (Trusted Publishing requires it)
        run: npm install -g npm@latest

      # Rust toolchain + wasm-pack are required because the SDK's
      # prepublishOnly hook runs `npm run build` which invokes
      # wasm-pack to produce core/pkg-web/* before tsc + dist/wasm/ copy.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-npm-wasm

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      # binaryen (wasm-opt) DISABLED on CI as of 0.1.3 — version drift between
      # local macOS binaryen and ubuntu-latest's apt-binaryen produces different
      # WASM bytes that crash on Node `WebAssembly.Table.grow()`. wasm-pack 0.14
      # already runs an internal `wasm-opt -O` pass; the extra `-Oz` shaves
      # ~3.6KB but is non-essential. Investigation of the root divergence
      # tracked in work/mnemonic-cli/decisions.md.

      - name: Install workspace dependencies
        run: npm ci

      # Always build SDK first — CLI's prepublishOnly tsc -b needs SDK's
      # dist/index.d.ts to resolve `@mnemonik-xyz/sdk` even when SDK skips
      # the actual npm publish (skip-if-already-published guard below).
      - name: Build @mnemonik-xyz/sdk
        run: npm run build --workspace packages/sdk

      # Skip-if-already-published guard: when only one of sdk/cli bumps for
      # a tag (e.g. cli-only patch), the other workspace's npm publish would
      # 403 with "cannot publish over previously published versions". Compare
      # local package.json version to npm registry; skip if equal.

      # Trusted Publishing (OIDC): npm auto-detects the GitHub Actions
       # OIDC token via the `id-token: write` permission above. No
       # NODE_AUTH_TOKEN, no NPM_TOKEN secret — npm publish authenticates
       # against the trusted-publisher config registered on each package's
       # npm settings page (see CLAUDE.md "## npm publishing"). Provenance
       # is signed automatically and verifiable end-to-end.
      - name: Publish @mnemonik-xyz/sdk
        run: |
          LOCAL=$(node -p "require('./packages/sdk/package.json').version")
          REMOTE=$(npm view @mnemonik-xyz/sdk version 2>/dev/null || echo "")
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "SDK $LOCAL already on registry — skipping publish"
          else
            npm publish --access public --provenance --workspace packages/sdk
          fi

      - name: Publish @mnemonik-xyz/cli
        run: |
          LOCAL=$(node -p "require('./packages/cli/package.json').version")
          REMOTE=$(npm view @mnemonik-xyz/cli version 2>/dev/null || echo "")
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "CLI $LOCAL already on registry — skipping publish"
          else
            npm publish --access public --provenance --workspace packages/cli
          fi
