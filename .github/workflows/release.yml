name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86:
    name: Build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-linux

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu -p mnemonic-mcp

      - name: Package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="mnemonic-mcp-${tag}-x86_64-unknown-linux-gnu"
          mkdir -p "$name"
          cp target/x86_64-unknown-linux-gnu/release/mnemonic-mcp "$name/"
          cp README.md "$name/" 2>/dev/null || true
          tar czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: ${{ env.ASSET }}

  build-linux-arm:
    name: Build aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --target aarch64-unknown-linux-gnu -p mnemonic-mcp

      - name: Package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="mnemonic-mcp-${tag}-aarch64-unknown-linux-gnu"
          mkdir -p "$name"
          cp target/aarch64-unknown-linux-gnu/release/mnemonic-mcp "$name/"
          cp README.md "$name/" 2>/dev/null || true
          tar czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-unknown-linux-gnu
          path: ${{ env.ASSET }}

  build-macos:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p mnemonic-mcp

      - name: Package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="mnemonic-mcp-${tag}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/mnemonic-mcp" "$name/"
          cp README.md "$name/" 2>/dev/null || true
          tar czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: Create Release
    needs: [build-linux-x86, build-linux-arm, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
