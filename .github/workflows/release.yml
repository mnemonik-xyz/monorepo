name: Release

on:
  push:
    tags: ["v*"]

# DR8-M1 (R1 deploy review): duplicate or force-pushed tag refs can
# trigger concurrent release runs that race on GitHub Release asset
# uploads and on Trusted-Publishing OIDC token reuse. Group by ref so
# a re-pushed tag cancels its in-flight predecessor instead of double-
# publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    # v0.2.3: Linux build deps now include `libdbus-1-dev` + `pkg-config`
    # (required by `libdbus-sys`, transitive of `keyring`). This should
    # make Linux builds succeed. `continue-on-error: true` is kept as a
    # safety net so any future apt/cross-compile drift still doesn't
    # block release (which depends only on build-macos for v1).
    continue-on-error: true
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install dependencies (native x86_64)
        if: matrix.cross == false
        # `libdbus-1-dev` is required by libdbus-sys (transitive of keyring).
        # Confirmed root cause of v0.2.3 first-attempt Linux build failure.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev g++ libdbus-1-dev

      - name: Install dependencies (cross aarch64)
        if: matrix.cross == true
        # `libdbus-1-dev:arm64` via multi-arch — same libdbus-sys requirement
        # as the native path. If multi-arch install drifts, the build will
        # fail but `continue-on-error: true` at job level keeps the release
        # pipeline moving (macOS is the v1 scope).
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config perl make libdbus-1-dev:arm64

      - name: Build
        env:
          OPENSSL_STATIC: ${{ matrix.cross && '1' || '' }}
          OPENSSL_LIB_DIR: ${{ matrix.cross && '' || '' }}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            export OPENSSL_SRC_PERL=/usr/bin/perl
          fi
          cargo build --release --target ${{ matrix.target }} -p mnemonic-mcp --features "openssl-vendored,local-embed"

      - name: Package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="mnemonic-mcp-${tag}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/mnemonic-mcp" "$name/"
          cp README.md "$name/" 2>/dev/null || true
          tar czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  build-macos:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p mnemonic-mcp --features local-embed

      - name: Package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="mnemonic-mcp-${tag}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/mnemonic-mcp" "$name/"
          cp README.md "$name/" 2>/dev/null || true
          tar czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: Create Release
    # v0.2.3 (Option A): only macOS gates the release. Linux builds
    # are non-blocking (see `continue-on-error` on build-linux above);
    # if Linux artifacts happen to land they are still picked up by
    # the `download-artifact@v4` step below and included in the
    # SHA256SUMS + GitHub Release. macOS-only is the v1 contract.
    needs: [build-macos]
    runs-on: ubuntu-latest
    # `id-token: write` + `attestations: write` are required by
    # actions/attest-build-provenance@v1 to mint the sigstore bundle
    # and publish the attestation under the repo. `contents: write`
    # remains the inherited workflow-level permission used by
    # action-gh-release to create the GitHub Release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # SHA256SUMS is consumed by packages/mcp/src/install-binary.ts
      # (Task 7) to verify the downloaded tarball matches the digest
      # signed by the GitHub-Actions-signed attestation below. Format
      # matches `sha256sum -b` so a downstream `sha256sum -c SHA256SUMS`
      # works for users who pull all tarballs into one directory.
      #
      # Layout assumption: `actions/upload-artifact@v4` (build-linux,
      # build-macos) names each artifact after its target triple, and
      # `download-artifact@v4` with `path: artifacts` materializes one
      # subdirectory per artifact — `artifacts/<target>/<tarball>.tar.gz`,
      # exactly one level deep. The `sed` below strips that single
      # `./<target>/` prefix so each line reads `<hash> *<filename>` and
      # the shim's parser sees the bare tarball name. If a future build
      # matrix change adds nesting depth (e.g. per-OS subdirs), the
      # post-normalization guard fails the job so the regression is
      # caught at release time, not at first install (SAR8-M1, CR8-001).
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -name 'mnemonic-mcp-*.tar.gz' -exec sha256sum -b {} \; > SHA256SUMS
          sed -i 's| \*\./[^/]*/| \*|' SHA256SUMS
          # SAR8-M1: refuse to publish a SHA256SUMS file whose lines
          # still embed a path separator — the shim's parser keys on
          # bare filenames, so a leftover `subdir/` prefix silently
          # breaks every install. `grep -q '/'` exits 0 if any `/`
          # remains; we invert that into a failure.
          if grep -q '/' SHA256SUMS; then
            echo 'ERROR: SHA256SUMS normalization failed — line still contains /' >&2
            cat SHA256SUMS >&2
            exit 1
          fi
          cat SHA256SUMS

      # GitHub artifact attestation (sigstore-backed). The shim's
      # verification model (Decision 8, install-binary.ts) runs
      # `gh attestation verify <tarball>` BEFORE extraction, so the
      # tarball is the correct subject. Attesting the extracted binary
      # would add no security (the tarball digest already commits to
      # its contents) and would require an extra extract+re-pack step
      # here. SAR8-M2 (R1): tarball-only is intentional, not a gap.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'artifacts/**/mnemonic-mcp-*.tar.gz'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/SHA256SUMS

  # T11 audit fix (A08) — npm publish with sigstore provenance.
  # Decision 13 + tech-spec acceptance criterion: both @mnemonik-xyz/sdk
  # and @mnemonik-xyz/cli MUST publish with `--provenance` so consumers
  # can verify the package was built from the tagged commit by GitHub
  # Actions (not by a maintainer's laptop).
  publish-npm:
    name: Publish to npm with provenance
    # Decoupled from Rust binary builds — npm packages don't consume Rust
    # binaries, only the SDK's WASM artifact (built locally via wasm-pack
    # in the prepublishOnly hook). Allows npm publish to proceed even if
    # macOS GitHub Actions runners are queue-degraded (Apr 2026 incident).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) requires npm CLI >= 11.5.1. Node 22
      # ships npm 10.x, so upgrade explicitly. Once the global install
      # finishes, subsequent `npm` invocations resolve to the new binary.
      - name: Upgrade npm to >=11.5.1 (Trusted Publishing requires it)
        run: npm install -g npm@latest

      # Rust toolchain + wasm-pack are required because the SDK's
      # prepublishOnly hook runs `npm run build` which invokes
      # wasm-pack to produce core/pkg-web/* before tsc + dist/wasm/ copy.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-npm-wasm

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      # binaryen (wasm-opt) DISABLED on CI as of 0.1.3 — version drift between
      # local macOS binaryen and ubuntu-latest's apt-binaryen produces different
      # WASM bytes that crash on Node `WebAssembly.Table.grow()`. wasm-pack 0.14
      # already runs an internal `wasm-opt -O` pass; the extra `-Oz` shaves
      # ~3.6KB but is non-essential. Investigation of the root divergence
      # tracked in work/mnemonic-cli/decisions.md.

      - name: Install workspace dependencies
        run: npm ci

      # Always build SDK first — CLI's prepublishOnly tsc -b needs SDK's
      # dist/index.d.ts to resolve `@mnemonik-xyz/sdk` even when SDK skips
      # the actual npm publish (skip-if-already-published guard below).
      - name: Build @mnemonik-xyz/sdk
        run: npm run build --workspace packages/sdk

      # Skip-if-already-published guard: when only one of sdk/cli bumps for
      # a tag (e.g. cli-only patch), the other workspace's npm publish would
      # 403 with "cannot publish over previously published versions". Compare
      # local package.json version to npm registry; skip if equal.

      # Trusted Publishing (OIDC): npm auto-detects the GitHub Actions
       # OIDC token via the `id-token: write` permission above. No
       # NODE_AUTH_TOKEN, no NPM_TOKEN secret — npm publish authenticates
       # against the trusted-publisher config registered on each package's
       # npm settings page (see CLAUDE.md "## npm publishing"). Provenance
       # is signed automatically and verifiable end-to-end.
      - name: Publish @mnemonik-xyz/sdk
        run: |
          LOCAL=$(node -p "require('./packages/sdk/package.json').version")
          REMOTE=$(npm view @mnemonik-xyz/sdk version 2>/dev/null || echo "")
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "SDK $LOCAL already on registry — skipping publish"
          else
            npm publish --access public --provenance --workspace packages/sdk
          fi

      - name: Publish @mnemonik-xyz/cli
        run: |
          LOCAL=$(node -p "require('./packages/cli/package.json').version")
          REMOTE=$(npm view @mnemonik-xyz/cli version 2>/dev/null || echo "")
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "CLI $LOCAL already on registry — skipping publish"
          else
            npm publish --access public --provenance --workspace packages/cli
          fi

  # Task 8 — publish @mnemonik-xyz/mcp (shim) via Trusted Publishing.
  # Gated on `release` so the SHA256SUMS asset + sigstore attestation
  # are visible on the GitHub Release *before* the npm shim is pullable
  # — first-run `ensureBinaryCached` in install-binary.ts would 404 on
  # SHA256SUMS otherwise.
  #
  # NOT gated on `publish-npm` by design (SAR8-INFO1): packages/mcp has
  # zero dependency on @mnemonik-xyz/sdk or @mnemonik-xyz/cli (pure Node
  # + tar). If a future change adds a workspace dep on either, ALSO add
  # the matching `needs:` here, otherwise the shim could ship pointing
  # at an SDK/CLI version that does not yet exist on the registry.
  publish-mcp-shim:
    name: Publish @mnemonik-xyz/mcp with provenance
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1; Node 22
      # ships 10.x. Same upgrade as publish-npm above.
      - name: Upgrade npm to >=11.5.1 (Trusted Publishing requires it)
        run: npm install -g npm@latest

      - name: Install workspace dependencies
        run: npm ci

      - name: Build @mnemonik-xyz/mcp
        run: npm run build --workspace packages/mcp

      # Skip-if-already-published guard mirrors publish-npm: republishing
      # an existing version 403s; skipping keeps tag re-runs idempotent.
      - name: Publish @mnemonik-xyz/mcp
        run: |
          LOCAL=$(node -p "require('./packages/mcp/package.json').version")
          REMOTE=$(npm view @mnemonik-xyz/mcp version 2>/dev/null || echo "")
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "@mnemonik-xyz/mcp $LOCAL already on registry — skipping publish"
          else
            npm publish --access public --provenance --workspace packages/mcp
          fi
