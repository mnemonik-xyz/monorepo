name: Docs link check

on:
  # PR / push triggers are OFF (owner decision 2026-09-23): PRs merge
  # without waiting on CI; the full pipeline runs nightly on the default
  # branch. Run on demand from the Actions tab (workflow_dispatch).
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: docs-link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee-link-check:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress 'docs/**/*.md' 'README.md' 'docs/WHITEPAPER.md'
          fail: true
